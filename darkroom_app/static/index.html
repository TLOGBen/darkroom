<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>darkroom</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header id="topbar">
  <button id="toggle-lib" class="icon" title="顯示／收起 preset 欄" aria-controls="col-lib">☰</button>
  <span class="brand">darkroom</span>
  <form id="open-form" autocomplete="off">
    <input type="text" id="photo-path" placeholder="照片路徑（JPEG／PNG／TIFF／HEIC），例如 D:\Photos\IMG_0001.jpg" spellcheck="false">
    <button type="submit" id="open-btn">開啟</button>
  </form>
  <button id="prev" title="上一張（←）" disabled>◀</button>
  <span id="position" class="mute">尚未開啟照片</span>
  <button id="next" title="下一張（→）" disabled>▶</button>
  <button id="grid-btn" title="縮圖格：看照片資料夾、多選、複製／貼上編輯、匯出所選" aria-pressed="false"><span class="btn-icon" aria-hidden="true">▦</span><span class="btn-text">縮圖格</span></button>
  <span id="carry-hint" class="hint" title="沿用上一張的設定（還不是這張的編輯，會再沿用到下一張）" hidden><span class="hint-icon" aria-hidden="true">沿用中</span><span class="hint-text">沿用上一張的設定（還不是這張的編輯，會再沿用到下一張）</span></span>
  <span class="sp"></span>
  <button id="undo" class="icon" title="復原（Ctrl+Z）" disabled>↶</button>
  <button id="redo" class="icon" title="重做（Ctrl+Shift+Z）" disabled>↷</button>
  <button id="reset-all" title="還原全部微調：把所有微調歸零（回到 preset × 強度）"><span class="btn-icon" aria-hidden="true">⟲</span><span class="btn-text">還原全部微調</span></button>
  <span id="status" class="mute" title="">預覽：待命</span>
  <button id="toggle-sl" class="icon" title="顯示／收起滑桿欄" aria-controls="col-sl">⚙</button>
</header>

<main id="editor">
  <section class="col" id="col-lib">
    <div class="libbar">
      <input type="search" id="search" placeholder="搜尋 preset 名稱或分類…" spellcheck="false">
      <button id="import-btn" title="匯入 xmp：選一個或多個 .xmp 檔，複製進 preset 庫（原檔不動）">匯入</button>
      <button id="new-group-btn" class="icon" title="新群組">＋</button>
      <input type="file" id="import-file" multiple accept=".xmp" hidden>
    </div>
    <div id="import-result" class="import-result" role="status" hidden></div>
    <div class="sec-title" id="lib-count">preset 庫</div>
    <div class="scroll tree" id="preset-tree" role="tree" aria-label="preset 庫"></div>
  </section>

  <section class="col" id="col-pv">
    <div class="pv-tools">
      <button id="hold" title="按住看原圖（快捷鍵：按住 \）">按住看原圖</button>
      <span id="skip-banner" class="warnbar" role="button" tabindex="0" hidden></span><span id="skip-note" class="skipnote" role="button" tabindex="0" hidden></span>
      <span id="edit-status" class="editstatus" hidden></span>
      <button id="restore-previous-btn" title="取回上一份：把最近一次被還原（清除）的編輯拿回來" disabled>取回上一份</button>
      <span class="sp"></span>
      <span class="mute" id="photo-size"></span>
      <select id="export-format" title="匯出格式：JPEG 8-bit 或 TIFF 16-bit"><option value="jpeg" selected>JPEG</option><option value="tiff">TIFF</option></select>
      <input id="export-quality" type="number" min="1" max="100" step="1" value="92" title="JPEG 品質（1～100，預設 92）">
      <button id="save-preset-btn" title="把目前的 preset × 強度＋微調存成自存 preset（不改目前的編輯）" disabled>存成 preset</button>
      <button id="export-btn" title="用全解析度匯出成新檔，存進照片旁的「darkroom 匯出」資料夾" disabled>匯出</button>
    </div>
    <div class="pv-wrap" id="preview">
      <img id="preview-img" alt="預覽" hidden>
      <div class="pv-empty" id="preview-empty">在上方輸入照片路徑後按「開啟」</div>
      <span class="pv-label" id="pv-label" hidden>原圖</span>
      <div id="skip-detail" class="skip-detail" role="dialog" aria-label="無法套用的設定（完整內容）" hidden></div>
    </div>
    <div class="strength">
      <div class="row">
        <span class="mute">目前 preset：</span><span class="pname" id="preset-name">（未選）</span>
      </div>
      <div class="row">
        <label for="strength"><b>強度</b></label>
        <div class="strength-track">
          <input type="range" id="strength" min="0" max="200" step="1" value="100" disabled>
          <span class="tick100" aria-hidden="true"></span>
        </div>
        <span class="val editable" id="strength-value" title="點兩下輸入強度">100%</span>
        <button id="strength-100" title="強度回到 100%">↺ 100%</button>
      </div>
    </div>
  </section>

  <section class="col" id="col-sl">
    <div class="scroll" id="sliders"></div>
  </section>
</main>

<main id="grid" hidden>
  <div class="gridbar">
    <input type="text" id="grid-path" placeholder="照片資料夾路徑，例如 D:\Photos" spellcheck="false">
    <button id="grid-load" title="列出這個資料夾的照片">載入</button>
    <span id="grid-count" class="mute"></span>
    <span class="sp"></span>
    <button id="copy-edit-btn" title="複製目前照片的編輯（preset 快照、強度、微調）" disabled>複製編輯</button>
    <button id="paste-edit-btn" title="把複製的編輯貼到選取的照片，取代它們原本的編輯" disabled>貼上編輯</button>
    <button id="export-selected-btn" title="用各自的編輯、全解析度匯出選取的照片（格式與品質取上方匯出設定）" disabled>匯出所選</button>
  </div>
  <div id="grid-result" class="import-result" role="status" hidden></div>
  <div class="scroll cells" id="grid-cells" role="listbox" aria-multiselectable="true" aria-label="照片縮圖格"></div>
</main>

<div id="toast" role="status"></div>
<script src="/static/logic.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
