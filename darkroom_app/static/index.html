<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>darkroom</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header id="topbar">
  <button id="toggle-lib" class="icon quiet" title="顯示／收起 preset 欄" aria-controls="col-lib"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg></button>
  <span class="brand">darkroom</span>
  <form id="open-form" autocomplete="off">
    <input type="text" id="photo-path" placeholder="照片路徑（JPEG／PNG／TIFF／HEIC），例如 D:\Photos\IMG_0001.jpg" spellcheck="false">
    <button type="submit" id="open-btn">開啟</button>
  </form>
  <span class="seg">
    <button id="prev" class="icon" title="上一張（←）" disabled><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg></button>
    <span id="position" class="mute">尚未開啟照片</span>
    <button id="next" class="icon" title="下一張（→）" disabled><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg></button>
  </span>
  <button id="grid-btn" title="縮圖格：看照片資料夾、多選、複製／貼上編輯、匯出所選" aria-pressed="false"><span class="btn-icon" aria-hidden="true"><svg viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx=".8"/><rect x="9" y="2.5" width="4.5" height="4.5" rx=".8"/><rect x="2.5" y="9" width="4.5" height="4.5" rx=".8"/><rect x="9" y="9" width="4.5" height="4.5" rx=".8"/></svg></span><span class="btn-text">縮圖格</span></button>
  <span id="carry-hint" class="hint" title="沿用上一張的設定（還不是這張的編輯，會再沿用到下一張）" hidden><span class="hint-icon" aria-hidden="true">沿用中</span><span class="hint-text">沿用上一張的設定（還不是這張的編輯，會再沿用到下一張）</span></span>
  <span class="sp"></span>
  <span class="seg">
    <button id="undo" class="icon" title="復原（Ctrl+Z）" disabled><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4.5H3v-3"/><path d="M3 4.5a5.5 5.5 0 1 1-1 4"/></svg></button>
    <button id="redo" class="icon" title="重做（Ctrl+Shift+Z）" disabled><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 4.5h3v-3"/><path d="M13 4.5a5.5 5.5 0 1 0 1 4"/></svg></button>
  </span>
  <button id="reset-all" title="還原全部微調：把所有微調歸零（回到 preset × 強度）"><span class="btn-icon" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M5.5 3.5H2.5v-3"/><path d="M2.5 3.5A5.8 5.8 0 1 1 2 8"/></svg></span><span class="btn-text">還原全部微調</span></button>
  <button id="reset-original-btn" title="還原成原圖：移除 preset 與全部微調（Ctrl+Z 可拿回；離開後可用「取回上一份」）" disabled><span class="btn-icon" aria-hidden="true"><svg viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="1.2"/><path d="M2.5 10.5 6 7l3 3 2-2 2.5 2.5"/></svg></span><span class="btn-text">還原成原圖</span></button>
  <span id="status" class="mute" title="">待命</span>
  <button id="cap-btn" class="quiet" title="功能狀態：哪些功能可用、關閉的原因" aria-haspopup="dialog" aria-controls="cap-detail" aria-expanded="false">功能正常</button>
  <button id="toggle-sl" class="icon quiet" title="顯示／收起滑桿欄" aria-controls="col-sl"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/><circle cx="10.5" cy="4.5" r="1.6" fill="#191919"/><circle cx="5.5" cy="8" r="1.6" fill="#191919"/><circle cx="9" cy="11.5" r="1.6" fill="#191919"/></svg></button>
</header>

<main id="editor">
  <section class="col" id="col-lib">
    <div class="libbar">
      <input type="search" id="search" placeholder="搜尋 preset 名稱或分類…" spellcheck="false">
      <button id="import-btn" title="匯入 xmp：選一個或多個 .xmp 檔，複製進 preset 庫（原檔不動）">匯入</button>
      <button id="new-group-btn" class="icon" title="新群組">＋</button>
      <input type="file" id="import-file" multiple accept=".xmp" hidden>
    </div>
    <div id="import-result" class="import-result" role="status" hidden></div>
    <div class="sec-title" id="lib-count">preset 庫</div>
    <div class="scroll tree" id="preset-tree" role="tree" aria-label="preset 庫"></div>
  </section>

  <section class="col" id="col-pv">
    <div class="pv-tools">
      <span class="seg"><button id="hold" title="按住看原圖（快捷鍵：按住 \）">按住看原圖</button><button id="ab-btn" title="對照：左邊原圖、右邊編輯後，拖分隔線比較（快捷鍵：Y）" aria-pressed="false" disabled>對照</button></span>
      <button id="crop-btn" title="裁切：拖框、選比例、拉直、旋轉、鏡像（快捷鍵：R；Enter 完成、Esc 取消）" aria-pressed="false" disabled>裁切</button>
      <span id="skip-banner" class="warnbar" role="button" tabindex="0" hidden></span><span id="skip-note" class="skipnote" role="button" tabindex="0" hidden></span>
      <span id="edit-status" class="editstatus" hidden></span>
      <button id="restore-previous-btn" title="取回上一份：把最近一次被還原（清除）的編輯拿回來" disabled>取回上一份</button>
      <span class="sp"></span>
      <span class="mute" id="photo-size"></span>
      <button id="save-preset-btn" title="把目前的 preset × 強度＋微調存成自存 preset（不改目前的編輯）" disabled>存成 preset</button>
      <button id="export-btn" title="匯出：打開匯出設定（格式、尺寸、中繼資料、銳利化），按 Enter 用全解析度匯出成新檔，存進照片旁的「darkroom 匯出」資料夾" aria-haspopup="dialog" disabled>匯出</button>
    </div>
    <div id="crop-panel" class="crop-bar" role="toolbar" aria-label="裁切" hidden>
      <label for="crop-aspect" class="mute">比例</label><select id="crop-aspect" title="裁切比例（預設：原始比例，鎖定）"></select>
      <button id="crop-orient" title="直式／橫式互換（快捷鍵：X）">直式</button>
      <label for="crop-angle" class="mute">拉直</label><input id="crop-angle" type="range" min="-45" max="45" step="0.1" value="0" title="拉直（雙擊歸 0）"><input type="number" id="crop-angle-num" min="-45" max="45" step="0.1" value="0" title="拉直角度（度，-45～45）">
      <button id="rotate-left" title="向左轉 90°（Ctrl+[）">向左轉 90°</button>
      <button id="rotate-right" title="向右轉 90°（Ctrl+]）">向右轉 90°</button>
      <button id="flip-h" title="水平鏡像">水平鏡像</button>
      <button id="flip-v" title="垂直鏡像">垂直鏡像</button>
      <button id="crop-reset" title="重設：回到沒有裁切、拉直與旋轉（Ctrl+Z 可拿回）">重設</button>
      <span id="crop-hint" class="mute">拖曳框或把手調整範圍；Enter 完成、Esc 取消</span>
      <span class="sp"></span>
      <button id="crop-cancel" title="取消（Esc）：丟掉這次的裁切">取消</button>
      <button id="crop-done" class="primary" title="完成（Enter）">完成</button>
    </div>
    <div class="pv-wrap" id="preview">
      <img id="preview-img" alt="預覽" hidden>
      <div class="pv-empty" id="preview-empty">在上方輸入照片路徑後按「開啟」</div>
      <span class="pv-label" id="pv-label" hidden>原圖</span>
      <img id="ab-orig" alt="" aria-hidden="true">
      <div id="ab-divider"><div id="ab-handle" tabindex="0" role="slider" aria-label="對照分隔線" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><i></i><i></i></div></div>
      <span class="ab-tag" id="ab-tag-a">原圖</span><span class="ab-tag" id="ab-tag-b">編輯後</span>
      <div id="crop-box" tabindex="0" role="group" aria-label="裁切框（拖曳移動，方向鍵 0.5%、Shift 5%）" hidden><b class="thirds"></b><i data-h="nw"></i><i data-h="n"></i><i data-h="ne"></i><i data-h="e"></i><i data-h="se"></i><i data-h="s"></i><i data-h="sw"></i><i data-h="w"></i></div>
      <div id="skip-detail" class="skip-detail" role="dialog" aria-label="無法套用的設定（完整內容）" hidden></div>
      <div class="canvas-pick" role="group" aria-label="預覽底色">
        <button class="c-dark" data-canvas="dark" title="底色：深灰" aria-pressed="true"></button>
        <button class="c-black" data-canvas="black" title="底色：黑" aria-pressed="false"></button>
        <button class="c-mid" data-canvas="mid" title="底色：中灰" aria-pressed="false"></button>
      </div>
    </div>
    <div class="strength">
      <div class="row">
        <span class="mute">目前 preset：</span><span class="pname" id="preset-name">（未選）</span>
      </div>
      <div class="row">
        <label for="strength"><b>強度</b></label>
        <div class="strength-track">
          <input type="range" id="strength" min="0" max="200" step="1" value="100" disabled>
          <span class="tick100" aria-hidden="true"></span>
          <span class="ticks" aria-hidden="true"></span>
          <span class="scale-num" style="left:5px" aria-hidden="true">0</span>
          <span class="scale-num" style="left:calc(5px + .5 * (100% - 10px))" aria-hidden="true">100</span>
          <span class="scale-num" style="left:calc(100% - 5px)" aria-hidden="true">200</span>
        </div>
        <span class="val editable" id="strength-value" title="點兩下輸入強度">100<span class="pct">%</span></span>
        <button id="strength-100" title="強度回到 100%">↺ 100%</button>
      </div>
    </div>
  </section>

  <section class="col" id="col-sl">
    <div class="scroll" id="sliders"></div>
  </section>
</main>

<main id="grid" hidden>
  <div class="gridbar">
    <input type="text" id="grid-path" placeholder="照片資料夾路徑，例如 D:\Photos" spellcheck="false">
    <button id="grid-load" title="列出這個資料夾的照片">載入</button>
    <span id="grid-filter" class="seg" role="group" aria-label="篩選"><button data-filter="all" aria-pressed="true" title="顯示全部照片">全部</button><button data-filter="edited" aria-pressed="false" title="只顯示有編輯的照片">已編輯</button><button data-filter="plain" aria-pressed="false" title="只顯示沒有編輯的照片">未編輯</button></span>
    <span id="grid-count" class="mute"></span>
    <span id="grid-pending" class="mute" hidden></span>
    <span class="sp"></span>
    <button id="copy-edit-btn" title="複製目前照片的編輯（preset 快照、強度、微調）" disabled>複製編輯</button>
    <button id="paste-edit-btn" title="把複製的編輯貼到選取的照片，取代它們原本的顏色（各自的裁切與旋轉保留，除非勾選旁邊的選項）" disabled>貼上編輯</button>
    <label class="xd-check" title="貼上時也換掉選取照片的裁切與旋轉"><input id="paste-geometry" type="checkbox">連同裁切與旋轉</label>
    <button id="grid-reset-original-btn" title="還原成原圖：移除選取照片的編輯（可用「取回上一份」拿回來）" disabled>還原成原圖</button>
    <button id="grid-restore-btn" title="取回上一份：把選取照片最近一次被清掉的編輯放回去" disabled>取回上一份</button>
    <button id="export-selected-btn" title="用各自存好的編輯、全解析度匯出選取的照片（先打開匯出設定）" aria-haspopup="dialog" disabled>匯出所選</button>
  </div>
  <div id="grid-result" class="import-result" role="status" hidden></div>
  <div class="scroll cells" id="grid-cells" role="listbox" aria-multiselectable="true" aria-label="照片縮圖格"></div>
</main>

<div id="cap-detail" class="cap-detail" role="dialog" aria-labelledby="cap-title" hidden>
  <div class="cap-head"><span id="cap-title">功能狀態</span><button id="cap-refresh" title="重新偵測 GPU、HEIC、WebP、照片庫、preset 庫、語意索引、1Password">重新偵測</button></div>
  <ul id="cap-list" class="cap-list"></ul>
</div>

<div id="export-backdrop" class="xd-backdrop" hidden>
<form id="export-dialog" class="xd" role="dialog" aria-modal="true" aria-labelledby="xd-title" autocomplete="off">
  <div class="xd-head"><span id="xd-title">匯出</span><span id="xd-target" class="mute"></span></div>
  <div class="xd-body">
    <div class="xd-row"><label for="xd-preset">匯出預設</label>
      <span class="xd-ctl"><select id="xd-preset" title="套用一組存好的匯出設定"><option value="">（自訂）</option></select>
      <button id="xd-preset-save" type="button" title="把目前的設定存成匯出預設（同名會取代，可復原）">存成預設…</button>
      <button id="xd-preset-delete" type="button" title="刪除選取的匯出預設（可復原）" disabled>刪除</button></span></div>
    <div class="xd-row"><label for="xd-format">格式</label>
      <span class="xd-ctl"><select id="xd-format" title="匯出格式"><option value="jpeg">JPEG</option><option value="png">PNG</option><option value="tiff">TIFF</option><option value="webp">WebP</option></select>
      <label for="xd-bit-depth" class="xd-sub">位元深度</label><select id="xd-bit-depth" title="位元深度：JPEG／WebP 只有 8-bit"><option value="8">8-bit</option><option value="16">16-bit</option></select></span></div>
    <div class="xd-row"><label for="xd-quality">品質</label>
      <span class="xd-ctl"><input id="xd-quality" type="number" min="1" max="100" step="1" value="92" title="JPEG／WebP 品質（1～100，預設 92）">
      <label class="xd-check"><input id="xd-max-kb-on" type="checkbox" title="限制 JPEG 檔案大小">檔案上限</label>
      <input id="xd-max-kb" type="number" min="10" max="1048576" step="1" value="800" title="JPEG 檔案大小上限（KB，1 KB = 1024 位元組）"><span class="mute">KB</span></span></div>
    <div class="xd-row"><label for="xd-resize-mode">尺寸</label>
      <span class="xd-ctl"><select id="xd-resize-mode" title="只縮小、不放大"><option value="">不縮放</option><option value="long_edge">長邊</option><option value="short_edge">短邊</option><option value="width">寬</option><option value="height">高</option><option value="megapixels">百萬像素</option><option value="percent">百分比</option></select>
      <input id="xd-resize-value" type="number" min="1" max="65535" step="1" value="2048" title="尺寸的值（px、百萬像素或 %）"></span></div>
    <div class="xd-row"><label for="xd-metadata">中繼資料</label>
      <span class="xd-ctl"><select id="xd-metadata" title="要帶出去的 EXIF"><option value="all">全部中繼資料</option><option value="copyright">只留版權</option><option value="none">不含中繼資料</option></select>
      <label class="xd-check"><input id="xd-remove-gps" type="checkbox" title="移除拍攝位置（GPS）">移除 GPS</label></span></div>
    <div class="xd-row"><label for="xd-sharpen-target">輸出銳利化</label>
      <span class="xd-ctl"><select id="xd-sharpen-target" title="依輸出用途銳利化"><option value="">不銳利化</option><option value="screen">螢幕</option><option value="matte">霧面紙</option><option value="glossy">光面紙</option></select>
      <select id="xd-sharpen-amount" title="銳利化強度"><option value="low">低</option><option value="standard" selected>標準</option><option value="high">高</option></select></span></div>
    <div id="xd-summary" class="xd-summary" role="status"></div>
  </div>
  <div class="xd-foot"><button id="xd-cancel" type="button" title="取消（Esc）">取消</button><button id="xd-go" type="submit" class="primary" title="匯出（Enter）">匯出</button></div>
</form>
</div>

<div id="toast" role="status"></div>
<script src="/static/logic.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
