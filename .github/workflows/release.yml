# Release (plan-v2 §4): pushing a tag `v<version>` builds every downloadable and attaches it to a DRAFT GitHub
# release, which a maintainer reviews and publishes by hand.
#
#   create-release  checks the tag equals darkroom_app.__version__, creates the draft release
#   desktop         Windows (.msi + NSIS .exe) and Linux (.deb + .AppImage) installers via tauri-action:
#                   sync version -> build web -> build the darkroom wheel -> fetch uv as the sidecar -> tauri build
#   cli             the `darkroom` launcher alone: darkroom-<ver>-windows-x64.exe and darkroom-<ver>-linux-x64.tar.gz
#
# torch is never bundled (GitHub's 2 GB per-file cap; the CUDA build alone is ~2.5 GB): the installed app downloads
# it on first run, after the user agrees (desktop/bootstrap).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The uv shipped inside the installers (externalBin sidecar). Its per-platform SHA-256 (from the uv release's
  # own .sha256 files) is pinned in the desktop matrix, so a replaced asset fails the build instead of shipping.
  UV_VERSION: "0.12.18"

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag must equal darkroom_app.__version__
        id: version
        run: |
          version="$(sed -nE 's/^__version__ *= *"([^"]+)".*/\1/p' darkroom_app/__init__.py)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match darkroom_app.__version__ ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "darkroom $VERSION" \
            --notes "darkroom $VERSION. Installers: Windows .msi / setup .exe, Linux .deb / .AppImage. The first launch downloads Python and PyTorch (about 3 GB with an NVIDIA GPU) after you agree. The darkroom-$VERSION-* files are the command-line launcher alone."
          # The numeric id tauri-action uploads to. Listing /releases and filtering on tag_name returned nothing for
          # the fresh draft (v0.1.0 shipped without installers because of it), so ask for this tag's release directly
          # and fail loudly if the id is still empty instead of letting tauri-action skip every upload.
          id="$(gh release view "$GITHUB_REF_NAME" --json databaseId --jq .databaseId)"
          if [ -z "$id" ]; then
            echo "::error::could not read the id of the draft release $GITHUB_REF_NAME"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    needs: create-release
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: msi,nsis
            triple: x86_64-pc-windows-msvc
            uv_asset: uv-x86_64-pc-windows-msvc.zip
            uv_sha256: cae6a3bc25239f83dffb467a4b180508d9da23986c04639ebfa44e43e6a84bff
          # 22.04 (older glibc) so the .deb / .AppImage run on more distributions
          - os: ubuntu-22.04
            bundles: deb,appimage
            triple: x86_64-unknown-linux-gnu
            uv_asset: uv-x86_64-unknown-linux-gnu.tar.gz
            uv_sha256: 89eadd7c76fc063887959510d5ba0ab1264dfd5f1143b925ddb73021a40acf16
    steps:
      - uses: actions/checkout@v7

      - name: Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential pkg-config patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Rust toolchain (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Sync version into tauri.conf.json and Cargo.toml
        run: node desktop/scripts/sync-version.mjs

      - name: Build the web front end
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build the darkroom wheel (bundled as an installer resource)
        shell: bash
        run: |
          python -m pip install build
          python -m build --wheel --outdir desktop/src-tauri/resources/wheels
          ls -l desktop/src-tauri/resources/wheels

      - name: Fetch uv as the Tauri sidecar
        shell: bash
        env:
          UV_ASSET: ${{ matrix.uv_asset }}
          UV_SHA256: ${{ matrix.uv_sha256 }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$UV_ASSET" "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/$UV_ASSET"
          python - "$RUNNER_TEMP/$UV_ASSET" "$UV_SHA256" "$TRIPLE" <<'PY'
          """Verify the pinned hash, then extract the uv executable as binaries/uv-<target triple>[.exe]."""
          import hashlib, os, sys, tarfile, zipfile
          archive, expected, triple = sys.argv[1:4]
          digest = hashlib.sha256(open(archive, "rb").read()).hexdigest()
          if digest != expected:
              sys.exit(f"uv checksum mismatch: {digest} != {expected}")
          exe = "uv.exe" if archive.endswith(".zip") else "uv"
          dest_dir = os.path.join("desktop", "src-tauri", "binaries")
          os.makedirs(dest_dir, exist_ok=True)
          dest = os.path.join(dest_dir, f"uv-{triple}" + (".exe" if exe.endswith(".exe") else ""))
          if archive.endswith(".zip"):
              with zipfile.ZipFile(archive) as z:
                  name = next(n for n in z.namelist() if n.rsplit("/", 1)[-1] == exe)
                  data = z.read(name)
          else:
              with tarfile.open(archive) as t:
                  member = next(m for m in t.getmembers() if m.name.rsplit("/", 1)[-1] == exe)
                  data = t.extractfile(member).read()
          with open(dest, "wb") as f:
              f.write(data)
          os.chmod(dest, 0o755)
          print(f"{dest}: {len(data)} bytes")
          PY

      - name: Install the pinned Tauri CLI
        working-directory: desktop
        run: npm ci

      - name: Build installers and upload them to the draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: desktop
          tauriScript: npm run tauri
          # tauri.bundle.conf.json adds the uv sidecar and the wheel; it is release-only because tauri-build
          # refuses to compile when an externalBin / resource is missing (plain `cargo build` must keep working).
          args: --config src-tauri/tauri.bundle.conf.json --bundles ${{ matrix.bundles }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          uploadUpdaterJson: false

  cli:
    needs: create-release
    name: cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Sync version
        run: node desktop/scripts/sync-version.mjs

      - name: Build the launcher
        working-directory: desktop
        run: cargo build --release -p darkroom-cli

      - name: Package and upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.create-release.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          out="$RUNNER_TEMP/dist"
          mkdir -p "$out"
          if [ "$RUNNER_OS" = "Windows" ]; then
            exe=desktop/target/release/darkroom.exe
            asset="$out/darkroom-$VERSION-$PLATFORM.exe"
            cp "$exe" "$asset"
          else
            exe=desktop/target/release/darkroom
            asset="$out/darkroom-$VERSION-$PLATFORM.tar.gz"
            tar -czf "$asset" -C desktop/target/release darkroom
          fi
          # the launcher must report the tagged version (sync-version ran before the build)
          test "$("$exe" --version)" = "darkroom $VERSION"
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
