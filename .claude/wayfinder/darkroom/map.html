<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wayfinder 共識地圖</title>
<style>
  :root{
    --sea:#101C26; --panel:#17283420; --card:#16242F; --line:#24384633;
    --ink:#E8EDF2; --muted:#8FA3B0; --faint:#5C7280;
    --beacon:#FFB454; --charted:#4FD6BE; --claimed:#7FB8E8; --blocked:#46606F;
    --serif:Georgia,'Times New Roman',serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
  body{
    background:var(--sea);color:var(--ink);
    font:15px/1.65 var(--serif);
    background-image:
      radial-gradient(1100px 500px at 85% -10%, #1B3040 0%, transparent 60%),
      repeating-linear-gradient(0deg, transparent 0 59px, #FFFFFF06 59px 60px),
      repeating-linear-gradient(90deg, transparent 0 59px, #FFFFFF06 59px 60px);
    min-height:100vh;
  }
  .wrap{max-width:1060px;margin:0 auto;padding:48px 28px 96px}
  .eyebrow{font:11px/1 var(--mono);letter-spacing:.28em;text-transform:uppercase;color:var(--faint)}
  header .eyebrow{color:var(--beacon)}
  h1{font-size:34px;font-weight:400;letter-spacing:.01em;margin:10px 0 6px}
  .dest{border-left:2px solid var(--beacon);padding:6px 0 6px 18px;margin:22px 0 8px;font-size:18px;font-style:italic;color:var(--ink)}
  .meta{font:12px var(--mono);color:var(--muted);margin-top:10px}

  section{margin-top:52px}
  h2{font-size:13px;font-weight:400;font-family:var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--muted);
     display:flex;align-items:center;gap:14px;margin-bottom:20px}
  h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#2E4656,transparent)}

  /* chart */
  .chart{position:relative;border:1px solid #223644;border-radius:6px;background:#0C161E;overflow-x:auto}
  .chart svg{display:block;min-width:640px}
  .edge{stroke:#33505F;stroke-width:1.2;fill:none}
  .edge.dest-edge{stroke-dasharray:4 5;stroke:#3B5A54}
  .node{cursor:pointer}
  .node rect{fill:#132430;stroke:var(--blocked);stroke-width:1.2;rx:7}
  .node text{font:11px var(--mono);fill:var(--muted)}
  .node .nid{font-size:12px;fill:var(--ink)}
  .node.frontier rect{stroke:var(--beacon);fill:#211C10}
  .node.frontier .halo{fill:var(--beacon);opacity:.14;animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.10}50%{opacity:.26}}
  .node.resolved rect{stroke:var(--charted);fill:#0F211F}
  .node.resolved .nid{fill:var(--charted)}
  .node.claimed rect{stroke:var(--claimed)}
  .node.dim,.edge.dim{opacity:.18}
  .node.lit rect{stroke-width:2}
  .edge.lit{stroke:var(--beacon);opacity:1}
  .destflag text{font:12px var(--serif);font-style:italic;fill:var(--beacon)}
  .destflag path{fill:var(--beacon)}
  .fogveil{pointer-events:none}
  .chart-cap{font:11px var(--mono);color:var(--faint);padding:10px 14px;border-top:1px solid #1B2C38;display:flex;gap:18px;flex-wrap:wrap}
  .chart-cap b{font-weight:400}
  .k{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:baseline}

  /* filters + cards */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .chip{font:11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
        background:none;border:1px solid #2A4150;border-radius:99px;padding:5px 13px;cursor:pointer}
  .chip[aria-pressed="true"]{color:var(--sea);background:var(--ink);border-color:var(--ink)}
  .chip:focus-visible,.node:focus-visible rect,summary:focus-visible,a:focus-visible{outline:2px solid var(--beacon);outline-offset:2px}
  .cards{display:grid;gap:10px}
  details.card{background:var(--card);border:1px solid #223644;border-left-width:3px;border-radius:5px}
  details.card[data-s="frontier"]{border-left-color:var(--beacon)}
  details.card[data-s="resolved"]{border-left-color:var(--charted)}
  details.card[data-s="claimed"]{border-left-color:var(--claimed)}
  details.card[data-s="blocked"]{border-left-color:var(--blocked)}
  summary{list-style:none;display:flex;gap:14px;align-items:baseline;padding:13px 18px;cursor:pointer;flex-wrap:wrap}
  summary::-webkit-details-marker{display:none}
  .tid{font:12px var(--mono);color:var(--faint);min-width:2.2em}
  .ttitle{font-size:16px;flex:1;min-width:200px}
  .badge{font:10px var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:2px 9px;border-radius:3px;border:1px solid}
  .badge.s-frontier{color:var(--beacon);border-color:var(--beacon)}
  .badge.s-resolved{color:var(--charted);border-color:var(--charted)}
  .badge.s-claimed{color:var(--claimed);border-color:var(--claimed)}
  .badge.s-blocked{color:var(--blocked);border-color:var(--blocked)}
  .badge.t{color:var(--faint);border-color:#2A4150}
  .card-body{padding:2px 18px 18px;border-top:1px solid #1D303C;color:#C7D3DC}
  .card-body h4{font:11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin:16px 0 6px}
  .card-body p{margin:8px 0}
  .card-body code{font:.85em var(--mono);background:#0C161E;padding:1px 6px;border-radius:3px}
  .card-body a,li a,.dest a{color:var(--charted)}
  .blockline{font:11px var(--mono);color:var(--faint)}

  /* map sections */
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px}
  ul.plain{list-style:none;display:grid;gap:10px}
  ul.plain li{padding-left:16px;position:relative;color:#C7D3DC}
  ul.plain li::before{content:"—";position:absolute;left:0;color:var(--faint)}
  .fogbox{position:relative;border:1px dashed #33505F;border-radius:6px;padding:20px 22px;overflow:hidden}
  .fogbox::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(105deg,transparent 30%,#8FA3B012 60%,#8FA3B022 100%)}
  .oos li{color:var(--faint)}
  .oos li::before{content:"✕";font-family:var(--mono);font-size:11px}
  footer{margin-top:70px;font:11px var(--mono);color:#41566417;color:var(--faint);opacity:.7}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Wayfinder · 共識地圖</div>
    <h1 id="effort-name"></h1>
    <div class="dest" id="destination"></div>
    <div class="meta" id="meta"></div>
  </header>

  <section aria-label="決策路線圖">
    <h2>決策路線圖</h2>
    <div class="chart">
      <svg id="graph" role="img" aria-label="票券阻擋關係圖"></svg>
      <div class="chart-cap">
        <b><span class="k" style="background:var(--beacon)"></span>前線 — 現在可處理</b>
        <b><span class="k" style="background:var(--claimed)"></span>已認領</b>
        <b><span class="k" style="background:var(--charted)"></span>已解決</b>
        <b><span class="k" style="background:var(--blocked)"></span>受阻</b>
        <b style="margin-left:auto">滑過：標亮依賴鏈 · 點擊：開啟票券</b>
      </div>
    </div>
  </section>

  <section aria-label="決策票券">
    <h2>決策票券</h2>
    <div class="chips" id="chips" role="group" aria-label="依狀態篩選"></div>
    <div class="cards" id="cards"></div>
  </section>

  <section>
    <h2>目前已定案</h2>
    <ul class="plain" id="decisions"></ul>
  </section>

  <section class="cols">
    <div>
      <h2>尚未釐清</h2>
      <div class="fogbox"><ul class="plain" id="fog"></ul></div>
    </div>
    <div>
      <h2>範圍外</h2>
      <ul class="plain oos" id="oos"></ul>
    </div>
  </section>

  <footer id="foot"></footer>
</div>

<script>

t-library-format.md) — 索引 artifact/11_preset/library.json、自存 preset 放 user/，原檔不改", "[① 未公開演算法各用哪個公開方法近似？](issues/03-proprietary-approximations.md) — Clarity／Texture 用 local Laplacian 金字塔、Dehaze 用暗通道去霧、亮部陰影用 guided filter 分層；全開 1.5MP 約 15 ms；調校先花在亮部陰影白黑（抬黑 811 個），對應數值沒參考渲染只是初值", "[③ 去雜物、去路人用什麼？](issues/10-object-removal-model.md) — SAM3（核心內建）指定＋補圖（LaMa 快速／Qwen 遮罩補圖精修）＋程式貼回原圖，保證遮罩外不變", "[③ 美顏、身形需要哪些模型？](issues/09-retouch-face-body-models.md) — AI 只找位置（BiSeNet 臉部解析、DWPose／SDPose 關鍵點、BiRefNet 人物遮罩），磨皮、去斑、液化都自己寫成滑桿；瘦腰要人物遮罩、大幅瘦身要先補背景", "[② 自動挑 preset 的現有做法？](issues/12-auto-preset-research.md) — 套在照片小圖上再比（LUT 快篩）＋檢索粗篩＋視覺 LLM 從 20 張縮圖挑前 3；準確度沒有公開證據，要盲測"], "fog": ["**照片庫完整版**：星等、旗標、收藏集、搜尋、批次匯出、參數檔放哪（照片旁或 App 資料夾）與同步規則。", "**RAW 管線細節**：解馬賽克用哪個、相機色彩描述檔（preset 裡 `CameraProfile` 是 Default Color 687、Embedded 603、Adobe Standard 37…）怎麼對應、白平衡從絕對值還是增量；等 ① 的 JPEG 版定案後才問得清楚。", "**80 個引用 Adobe 內建 Look 的 preset**：有沒有合法的描述檔來源（Adobe DNG Converter？）。", "**② 的互動方式**：AI 建議怎麼呈現給使用者（一鍵套用？逐項接受？），系統提示詞內容。", "**③ 的滑桿介面**：美顏、身形各要哪些滑桿、預設值。", "**匯出**：把自己的微調另存成 xmp 的格式細節（能不能讓真的 Lightroom 讀回去）。", "~~57 個舊版處理流程（PV2010）的 preset~~（2026-10-04 更正：實查這 57 個 ProcessVersion 6.7 全部使用 `*2012` 鍵，是 PV2012 而非 PV2010；核心函式庫合約已改為支援）。"], "outOfScope": ["[② preset 效果概念地圖怎麼建、AI 怎麼挑？](issues/13-preset-concept-map.md) — **AI 自動挑 preset 與靈感模式拿掉**（使用者 2026-10-04，看過實驗後判斷不值得：LLM 挑選不穩定）；preset 由使用者自己挑", "**用 AI 取代程式調色**（整個 preset 寫成提示詞讓 Qwen 重畫）：違反已定原則。", "**逐像素重現 Adobe 的結果**：演算法未公開，做不到；目標是觀感相近。"], "tickets": [{"id": "01", "title": "① 預覽速度原型：後端 GPU 預覽一次往返能不能在約 0.1 秒內？", "type": "task", "status": "resolved", "blockedBy": [], "question": "拖動滑桿要即時（使用者選）。做一個最小原型量實際延遲：ComfyUI 自訂路由收參數 → torch 在 GPU 上對約 1.5MP 的縮小圖套一組代表性運算（曝光、曲線、HSL、局部反差）→ 編成 JPEG 傳回瀏覽器；量從送出到畫面更新的時間（p50／p95），同時跑著 ComfyUI 其他模型閒置時的情況。結果決定預覽在後端算（計畫的做法）還是改瀏覽器 WebGL。AFK：代理可以自己做完並回報數字。\n\n\n（2026-10-04：研究「① 未公開演算法…」量到全部運算 1.5MP 約 15 ms，運算本身不是瓶頸；這張要量的是傳輸、JPEG 編碼與瀏覽器更新的整趟往返。）", "answer": "（2026-10-04，執行子代理；原型與重跑方式在 [prototypes/preview-latency/](../prototypes/preview-latency/)。主 session 驗收：custom_nodes 複本已刪、測試輸出已清、`git status` 無其他改動。測試圖 1013×1481（1.5MP，由 24MP 縮出），JPEG q85。）\n\n**賭注成立：連續拖動遠低於 100 ms。** 往返 p50 24～29 ms、p95 28～34 ms；滑桿動到畫面更新 p50 29～37 ms、p95 39～45 ms；38～54 fps。運算約 15～19 ms（伺服器微基準整套 15.1～15.8 ms），傳輸約 2 ms、瀏覽器解碼約 4 ms。ComfyUI 載著大模型（VRAM 13.6GB）時一樣快。→ **預覽在後端算（計畫的做法）確定，不需要改瀏覽器 WebGL 當主要路徑。**\n\n實作要照的寫法：\n- **專用的高優先 CUDA stream、只同步自己那條**，不要 `torch.cuda.synchronize()`：ComfyUI 正在取樣時，舊寫法每張預覽要等一個取樣步（約 1.7 秒）；專用 stream 可達 16.7 fps、延遲 p50 40 ms、p95 98 ms，代價是出圖每步慢約 12%（1.71 → 1.91 秒，停手即恢復）。\n- **JPEG 用 CPU 的 cv2 編碼**（2.5～3 ms、0 張壞）；GPU nvjpeg 在 GPU 忙時卡 400～830 ms 且吐壞檔，目前這套 torch 2.14／torchvision 0.29 上不安全。\n- **HTTP POST＋「最新一次優先」**即可；WebSocket 沒有比較快（本機多 2～3 ms）。\n- GPU 工作放在單一執行緒 executor，不卡 aiohttp 事件迴圈。\n- 運算受 kernel 啟動開銷限制（像素數影響小：0.75MP 14 ms、3MP 24 ms）；CUDA graph／`torch.compile` 合併 local Laplacian 小 kernel 可再省幾 ms（CUDA graph 錄製要先把參數改成預先放好的 GPU tensor）。\n\n**已知的例外：閒置後的第一次點擊** p50 50～130 ms、p95 110～300 ms，原因是 GPU 閒置 0.5 秒以上就降頻（P5／P8，210～675 MHz；連續工作時 2655 MHz、P2），約 5 張內恢復。軟體對策（背景 keep-alive、點擊前暖身、懸停暖身）都不穩。可靠的兩條路：(a) NVIDIA 控制台把 ComfyUI 的 `python.exe` 設成「偏好最高效能」——驅動設定，依 CLAUDE.md 要問使用者；(b) 前端先用 WebGL 做便宜近似（曝光、白平衡、曲線、HSL）立刻顯示，再用後端結果覆蓋。選哪條見 Comments。", "comments": "（2026-10-04）**使用者決定閒置後第一下的處理：選 A——在 NVIDIA 控制台把 ComfyUI 的 `python.exe`（`runtimes/comfyui/<版本>/ComfyUI_windows_portable/python_embeded/python.exe`）設成「電源管理模式：偏好最高效能」**（另兩個選項：前端 WebGL 簡化版預覽、不處理）。驅動設定由使用者在實作階段照步驟清單自己操作（管理 3D 設定 → 程式設定 → 加入該 python.exe → 電源管理模式），做完重跑原型的單次點擊測試確認；換新版可攜版時路徑會變，要重設。若效果不夠再考慮 WebGL 簡化版。\n\n（2026-10-04）載體改為獨立 App：預覽路由改掛在 App 自己的伺服器上，量到的做法（HTTP POST＋最新一次優先、cv2 編碼、單一執行緒 executor）照用；「專用高優先 CUDA stream」在 ComfyUI 同時出圖時仍需要（兩個程序共用 GPU）；NVIDIA「偏好最高效能」改設在 App 的 python.exe。", "file": "issues/01-preview-latency-prototype.md"}, {"id": "02", "title": "① 節點介面長怎樣？", "type": "prototype", "status": "resolved", "blockedBy": [], "question": "做一份粗略的介面草圖（HTML 原型即可）給使用者看：preset 資料夾樹（150 群組、兩層）與搜尋、預覽區（前後比較）、強度 %、滑桿分組（基本／曲線／HSL／顏色分級／細節／效果／校正）、AI 補強區、「套用／不暫停」按鈕；放在 ComfyUI 節點裡還是開一個大面板。要決定的是配置與操作方式，不是視覺細節。", "answer": "**使用者決定（2026-10-04，看過 [prototypes/node-ui/index.html](../prototypes/node-ui/index.html) 的 A／B 兩版草圖後）：**\n1. **B 版為主、可以展開成 A**：畫布上平常是小節點（縮圖、目前 preset、強度、微調幾項、略過提示、「開啟編輯器」「套用並繼續」「不暫停模式」），點開是全螢幕三欄編輯器（左 preset 庫、中預覽、右滑桿，像 Lightroom 修改模組）；需要時可以把同一套編輯器展開嵌在節點裡（A 版）。\n2. **強度 0～200%，點新 preset 時強度回到 100%**；微調使用者沒特別指定，沿用草圖的「點新 preset 時清空微調」。\n3. **強度滑桿放預覽正下方**（照草圖）。\n4. **全螢幕編輯器要有「上一張／下一張」**，方便批次逐張調。\n5. **不用記住滑桿群組的展開狀態**。\n6. **保留 `params` 輸入／輸出**（草圖代理的提案：把調好的參數傳給下游節點，或從上游帶進來；使用者回答「流」，主 session 解讀為「留」）。\n\n草圖裡已呈現、使用者沒有反對的其他細節（實作時照做）：微調過的滑桿標橘色＋●、單項 ↺ 還原與雙擊還原、群組標「微調 N 項」、「還原全部微調」；預覽按住看原圖（`\\` 鍵）、前後切換、分割比較；含 Adobe Look 或遮罩的 preset 在樹上標 ⚠、選了顯示黃色說明條；AI 補強與「AI 自動挑 preset」（3 張候選）的位置；preset 樹最上方固定「★ 最愛」「我的 preset」。", "comments": "（2026-10-04）載體改為獨立 App（見「① 載體…」）：草圖的 B 版全螢幕三欄編輯器＝App 主畫面；「上一張／下一張」、強度、微調標示、params 等決定都沿用；B 版小節點與 A 版內嵌只在之後做 ComfyUI 節點時才用。", "file": "issues/02-node-ui-prototype.md"}, {"id": "03", "title": "① 未公開演算法各用哪個公開方法近似？", "type": "research", "status": "resolved", "blockedBy": [], "question": "Adobe 沒公開的：清晰度（1083 個 preset 用到）、去朦朧（673）、紋理（324）、亮部／陰影（PV2012，數值大時影響最大）、PV2012 曝光的高光滾降。查開源與文獻的近似做法（RawTherapee、darktable、論文、社群的逆向分析），每項列出候選方法、在 GPU 上的成本、已知跟 Adobe 的差異，推薦一個。另查 `LRTemplate Apply` 節點（comfyai.run 文件提到）的出處與實作方式可否參考。", "answer": "（2026-10-04，研究子代理；詳見 [research/03-proprietary-approximations.md](../research/03-proprietary-approximations.md)，27 個來源；GPU 時間是子代理在這台用 ComfyUI 內建 torch 2.14 跑原型量的，腳本在 scratchpad、未進 repo。主 session 重算 preset 統計屬實：Blacks 正值 811、Highlights |x|≥50 有 566、Clarity 平均絕對值 16.7、ProcessVersion 6.7 有 57 個。）\n\n- **調校優先順序**：Highlights／Shadows／Whites／Blacks 幾乎每個 preset 都用、平均絕對值 36～46、|x|≥50 各有 332～566 個；Blacks 有 811 個是正值（抬黑＝霧面感的主要來源，推論）。Clarity／Dehaze／Texture 平均只有 ±17 左右，近似不準影響小。**調校先花在亮部、陰影、白、黑。**\n- **各項推薦**：\n  - Clarity：快速 local Laplacian filter（Aubry 2014），在 log 亮度上做、加中間調權重（Adobe 說過 PV2012 的 Clarity、Highlights、Shadows 源自 local Laplacian）。1.5MP 10 ms、24MP 92 ms。\n  - Dehaze：dark channel prior＋guided filter（RawTherapee、darktable 的路線）；大氣光與透射率下限只在預覽圖算一次、以只動亮度為主；估不出霧時退回「全域扣霧幕＋對比＋飽和」。2.1 ms／25.6 ms。\n  - Texture：Laplacian 金字塔中頻帶增益＋coring 避開雜訊，跟 Clarity 共用金字塔。\n  - Highlights／Shadows：guided filter 做平滑亮度基底、套分區曲線、細節加回（darktable tone equalizer、RawTherapee shadows/highlights 的路線）。0.5 ms／7 ms；天際線光暈調不掉再升級成共用的 local Laplacian。\n  - Whites／Blacks：全域、依照片調整的端點曲線，錨點取預覽直方圖 0.5%／99.5% 百分位（依照片調整的規則是推論）。\n  - Exposure：線性光乘 2^EV＋平滑肩部；負 EV 借 Adobe 公開 DNG SDK 的二次式讓純白對到純白。\n- **成本**：全部打開 1.5MP 預覽約 15 ms、24MP 輸出約 0.15 秒；24MP 時 local Laplacian 顯存峰值約 7GB（fp32），要改 fp16 或分塊。→ 支持「後端算預覽」的賭注在運算這一段成立，剩下要量的是傳輸與編碼（「① 預覽速度原型」那張）。\n- **`LRTemplate Apply` 不值得參考**：出自 `mcaishao123/ComfyUI-lut`（MIT）；曝光在 sRGB 上直接乘且 EV 減半、亮部陰影白黑都是全域遮罩、Clarity 是大半徑 unsharp mask、沒有 Dehaze／Texture。RAWviewer、VibePhoto、LumiBase 也是憑經驗調；LumiBase 只校了負 Highlights 且沒有授權條款，不能抄。\n- **授權限制**：darktable、RawTherapee 是 GPL，只能參考演算法與參數範圍，不能把程式碼抄進節點。\n- **未知**：沒有 Adobe 參考渲染，所有「-100～+100 對應到參數」只是推論的初值，偏偏霧面感的關鍵數字（Blacks 正值抬多少、Highlights -85 壓多少）完全不知道。校正來源：賣家前後對比圖反推，或使用者決定是否用 Lightroom 試用期一次渲染「單一滑桿掃描」校正集——交給「① 『像 Lightroom』的驗收方式？」。Dehaze 在沒霧的照片上 dark channel 可能估錯（很多人像 preset 加 +10～+20）。", "comments": "", "file": "issues/03-proprietary-approximations.md"}, {"id": "04", "title": "① AI 補強怎麼接？", "type": "grilling", "status": "resolved", "blockedBy": ["03"], "question": "已定：未公開的那幾項每項二選一「程式近似／交給 AI」，交給 AI 的部分＋使用者的加強要求 → PE 寫修圖提示詞 → Qwen 修圖接在程式調色之後，再用「AI 補強強度」滑桿混合。要定：哪幾項開放給 AI、二選一的介面、混合方式（整張混合會不會因 Qwen 移動內容而重影，需要實測）、PE 指示怎麼寫、預設關還是開。\n\n\n（2026-10-04 補充：AI 補強的提示詞要吃使用者的「想要的方向」與「不想要的方向」；要定「不想要」走 PE 指示裡的避免清單、Qwen 的負面提示詞，還是兩者都用——萬事通的負面提示詞只在取樣「自訂」或 Fix 時有作用。）", "answer": "**定案（2026-10-04）：維持使用者的選項 A——AI 補強只做「加強」，清晰度、去朦朧、紋理等未公開項目全由程式近似。** 實驗「① AI 補強實驗：程式近似 vs Qwen、混合會不會重影？」支持這個選擇：5 張照片全部程式較好，Qwen 會重畫內容。Qwen 加強／重畫（也是 ② 的「大膽版」）的實作條件：不用 Pruna 8 步（整張位移 14～28 px）、混合前先對齊或用原尺寸原長寬比跑、預設混合強度 ≤25%、考慮只取低頻或遮罩排除五官（未實測）、不用 PE 改寫（直接英文指令）。「不想要」的保留類要求 Qwen 不會遵守，只能靠混合強度與遮罩控制。", "comments": "（2026-10-04：使用者想先實驗再定案，下面原本的答案改為**暫定**，等「① AI 補強實驗：程式近似 vs Qwen、混合會不會重影？」的結果。）\n\n### 暫定答案\n\n**使用者決定（2026-10-04）：AI 補強只做「加強」**（選項 A）——未公開的那幾項（清晰度、去朦朧、紋理、亮部陰影白黑）一律由程式近似，取消「每項程式／AI 二選一」。依據：研究「① 未公開演算法各用哪個公開方法近似？」顯示清晰度、去朦朧、紋理平均只有 ±17、程式近似夠用；亮部陰影白黑是全域調色的基礎，交給會重畫的 AI 風險大。AI 補強＝使用者的「想要／不想要」→ PE 寫修圖提示詞 → Qwen 修圖接在程式調色之後 →「AI 補強強度」滑桿混合。實作時的建議值（未經使用者決定、實作可調）：預設關；「不想要」同時進 PE 指示的避免清單與 Qwen 負面提示詞（後者只在取樣「自訂」或 Fix 有作用）。混合時 Qwen 移動內容造成重影的風險要在實作時實測（未實查）。\n\n\n（2026-10-04 補充：使用者問「先套 preset 再讓 AI 完整修圖」有沒有風險。已知：Qwen 整張重畫，社群實測對齊後仍約 2.6% 像素被改、臉與配色會漂（研究「③ 去雜物…」）；可能洗掉 preset 的色調（推論，未實查）；`resolution=0` 捨入到 32 倍數會錯位（原始碼已查）。風險依照片而定：真人照片最大，風景、食物、AI 生成圖小。降低方法：混合強度、臉部遮罩貼回、只改指定區域再程式貼回。是否開放「完整修圖」與預設值，等「① AI 補強實驗…」的數字決定。）", "file": "issues/04-ai-boost-wiring.md"}, {"id": "05", "title": "① 「像 Lightroom」的驗收方式？", "type": "grilling", "status": "resolved", "blockedBy": [], "question": "沒有 Lightroom 可對照。要定：像到什麼程度算過關（觀感相近的標準）、拿什麼來比（賣家附的前後對比圖？使用者以前用 Lightroom 修過的原圖＋成品？）、要不要用視覺 LLM 依 preset 意圖逐項打勾當輔助。答案決定調校方法。\n\n\n（2026-10-04：研究「① 未公開演算法各用哪個公開方法近似？」指出所有對應數值都只是初值，霧面感的關鍵（Blacks 正值抬多少、Highlights -85 壓多少）沒有參考就無法校正；可選的校正來源多一個：使用者是否願意用 Lightroom 試用期一次渲染「單一滑桿掃描」校正集。）", "answer": "**使用者決定（2026-10-04）：用 Lightroom 免費試用期，一次性渲染「單一滑桿掃描」校正集**（選項 A；另兩個選項是賣家前後對比圖反推、只靠眼睛調）。用完即取消試用。校正集的內容與操作步驟另開「① 校正集要渲染哪些圖、怎麼做？」由代理寫成清單，使用者照做；校正時以校正集的誤差（例如 ΔE、亮度曲線差）為準，眼睛判斷為輔。", "comments": "", "file": "issues/05-fidelity-acceptance.md"}, {"id": "06", "title": "① preset 庫的資料格式？", "type": "grilling", "status": "resolved", "blockedBy": [], "question": "已定：資料夾樹、搜尋、改名、搬資料夾、建資料夾、最愛、匯入；不改原檔，改動記在索引。要定：索引檔放哪（跟 preset 一起放在 artifact/11_preset，還是 ComfyUI 的 user 資料夾）、格式、匯入時名稱或檔案重複怎麼處理、匯出成 xmp 的時機與內容、使用者自己存的 preset 放哪。", "answer": "**使用者決定（2026-10-04）：索引檔跟 preset 放一起**——`artifact/11_preset/library.json`；使用者自己存的 preset 放 `artifact/11_preset/user/`（選項 A；另一個選項是放 ComfyUI 的 user 資料夾，換版要搬）。原本的 xmp 不改，改名、搬資料夾、最愛只記在索引。匯入時名稱或檔案重複怎麼處理、匯出 xmp 的細節屬實作細節，由實作者照「不改原檔、可重建」原則決定（已在「還看不清楚」的匯出項）。", "comments": "", "file": "issues/06-preset-library-format.md"}, {"id": "07", "title": "① 跟萬事通的關係？", "type": "grilling", "status": "resolved", "blockedBy": ["02"], "question": "獨立一份 workflow（例如「9 相片編輯」）、放進 7 萬事通當一個區塊、還是單一節點可以接在任何 workflow 後面（萬事通出圖後接、或單獨修照片）。影響輸出接法與 SeedVR2、存檔怎麼串。", "answer": "**使用者決定（2026-10-04）：做成單一節點，可接在任何 workflow 後面；另附一份現成的「9 相片編輯」workflow 當入口；7 萬事通不改**（選項 A；另兩個是放進萬事通當一個區塊、只做節點不附 workflow）。「9 相片編輯」的骨架：讀圖 → 相片編輯節點（B 版小節點）→ SeedVR2 放大（選用、預設關，接法照萬事通的開關）→ 存檔（前綴照使用者慣例 `<資料夾>/%date:yyyy-MM-dd%-<名稱>`）。萬事通出圖後要調色時，把節點接在萬事通的輸出後面即可；節點的 `params` 輸入／輸出可把參數帶到下一張。workflow 照慣例由 `projects/comfyui/tools/` 的產生器產出。", "comments": "（2026-10-04）這個答案假設載體是 ComfyUI；使用者質疑後開了「① 載體：放在 ComfyUI，還是做成獨立的本機修圖 App？」，那張的答案可能推翻本票。\n\n（2026-10-04 更新）**本票答案已被「① 載體：放在 ComfyUI，還是做成獨立的本機修圖 App？」取代**：不再做「單一節點＋9 相片編輯 workflow」，改為獨立 App；萬事通不改的部分仍成立；App 出圖後要接萬事通或 SeedVR2 時透過 ComfyUI API。", "file": "issues/07-relation-to-aio.md"}, {"id": "08", "title": "② AI 修圖助理用哪個 LLM 看圖、輸出什麼格式？", "type": "grilling", "status": "resolved", "blockedBy": [], "question": "候選：PE-I2I（9B，快、官方為 Qwen-Image 微調，但不是為攝影調色訓練）、35B（通用、會看圖，2026-10-04 實測約 61 tok/s）。輸出要能直接變成 ① 的參數：推薦哪個 preset＋強度、滑桿增減、裁切框、漸層位置。要定：模型、輸出格式（JSON 欄位用 xmp 的 crs 鍵名？）、怎麼讓它挑 preset（1466 個要先有文字描述，`ComfyUI-LightroomXMP` 可產生）。\n\n\n（2026-10-04 補充：怎麼挑 preset 的部分拆到「② preset 效果概念地圖怎麼建、AI 怎麼挑？」，這張專注在用哪個 LLM 與輸出格式。）\n\n（2026-10-04 使用者改變 ② 的方向：不再讓 LLM 挑 preset，改成 **LLM 看圖直接決定滑桿數值（程式套用、可再微調）＋需要時 Qwen 重畫（混合強度控制）**，兩種都要。本票改問：用哪個模型決定滑桿數值、輸出格式（欄位用 xmp 鍵名、數值範圍與步距）、怎麼吃「想要／不想要」、要不要多次取樣平均以壓低不穩定；Qwen 重畫那一側跟「① AI 補強怎麼接？」共用。「② 35B vs PE-I2I」實驗的速度、JSON 合格率、不穩定性數字可參考，但它測的是挑 preset，不是給數值。）", "answer": "**使用者決定（2026-10-04）：② 給滑桿數值用 PE-I2I（不思考），加兩道防線**（選項 A；另一選項是 35B）。依據實驗「② 35B vs PE-I2I：直接給滑桿數值」：短提示詞下速度相近、VRAM 少 3.6GB、方向檢查 18/18、想要／不想要 25/26、萬事通本來就用它。防線：(1) **白平衡由程式先量**（中間調 Lab a/b）決定方向，模型只決定幅度與是否保留暖光等氣氛；(2) **規則檢查**——診斷與數值方向矛盾就重問或把該滑桿歸零。輸出用 llama-server 的 json_schema 強制（欄位用 xmp 鍵名與範圍）；提示詞寫清楚各滑桿正負意義（特別是 Blacks2012）、要求「沒問題的滑桿給 0」以壓掉固定套路，或改成輸出各問題嚴重度由程式換算。思考模式不用。", "comments": "", "file": "issues/08-assistant-llm-and-schema.md"}, {"id": "09", "title": "③ 美顏、身形需要哪些模型？", "type": "research", "status": "resolved", "blockedBy": [], "question": "美顏（磨皮、亮眼、白牙、去斑，滑桿調強度）要找出臉、五官、皮膚範圍；身形（瘦腰、拉腿長，液化變形，滑桿調強度）要身體各部位的位置。查：臉部分割／關鍵點模型的候選（授權、大小、ComfyUI 有沒有現成節點、Windows＋torch 2.14 能不能裝）；已裝的 DWPose 夠不夠做身形液化；開源的液化／瘦身演算法。", "answer": "（2026-10-04，研究子代理；詳見 [research/09-retouch-face-body-models.md](../research/09-retouch-face-body-models.md)，36 個來源。主 session 抽查屬實：核心有 `SDPoseKeypointExtractor`（`nodes_sdpose.py`）；onnxruntime 1.30.0（CPU 版）、kornia 0.8.3 已裝；DWPose 模型在 `models/dwpose/`，執行它的 `rtmlib` 只在 `scratch/pylib-rtmlib/`，沒有 ComfyUI 節點——scratch 會被清，要搬到正式位置。）\n\n- **美顏找位置**：臉部各區域用 BiSeNet 臉部解析（yakhyo 的 ResNet34 ONNX 版，約 82MB、19 類、MIT），用已裝的 CPU 版 onnxruntime 就能跑；虹膜、眼白等細部可用 MediaPipe Face Landmarker（478 點）補——但 mediapipe 在 Python 3.13 能不能跑未確認（新版沒有 `mediapipe.solutions`、會拉 `opencv-contrib-python` 要用 `--no-deps`），備案是 BiSeNet 的眼睛類別＋68 點眼眶點。\n- **美顏做調整（程式，滑桿控制）**：自己寫，零件都有（kornia `guided_blur`／`bilateral_blur`、OpenCV `cv2.inpaint`）。磨皮＝三層頻率分離、只衰減中頻、細紋理層不動（保留毛孔）；去斑＝中頻找小點再補色；亮眼、白牙＝遮罩內調 LAB。顏色門檻選像素是推論，要拿真照片調。\n- **身形**：關鍵點用 DWPose（要包成節點）或核心內建 SDPose（134 點、Apache-2.0，要再下載約 2GB）；人物範圍用已有的 BiRefNet。變形自己寫：MLS 在粗網格算位移場、`grid_sample` 套圖，強度滑桿乘位移量。瘦臉（下顎點）、拉腿長（髖膝踝）關鍵點夠；**瘦腰不夠**（沒有腰點、沒有輪廓），要搭人物遮罩量。小幅度靠遮罩外固定錨點、位移衰減到 0；**大幅瘦身要先補背景，跟「③ 去雜物、去路人用什麼？」的補圖流程相依**。\n- **沒有現成的「吃關鍵點自動瘦腰拉腿」節點**；Olm Liquify 是手動筆刷；JH-PixelPro 要 ComfyUI ≥ 0.43，可參考其演算法（Apache-2.0）。\n- **避開**：SegFormer face-parsing（jonathandinu）、InsightFace 預訓練模型、FlowBasedBodyReshaping、Sapiens v1（非商用或學術限定）；會拉 `ultralytics`（AGPL）、`opencv-contrib-python`、`onnxruntime-gpu` 的節點包（會跟本機套件打架）。Sapiens2 可商用，可當身體部位分割的升級選項。\n- **未知**：mediapipe 能不能裝；BiSeNet 輸入 512×512 在高解析人像上邊緣準不準；BiRefNet、SDPose 在這台都還沒測。", "comments": "", "file": "issues/09-retouch-face-body-models.md"}, {"id": "10", "title": "③ 去雜物、去路人用什麼？", "type": "research", "status": "resolved", "blockedBy": [], "question": "候選：萬事通現有的 Qwen-Image 修圖（提示詞「移除 ⋯」，會不會動到其他地方？）、專門的補圖模型（LaMa、Flux Fill 之類）。查：各自的效果特性、VRAM、ComfyUI 節點、授權；怎麼讓使用者指定要移除的東西（框選、點選、文字描述＋分割）。", "answer": "（2026-10-04，研究子代理；詳見 [research/10-object-removal-model.md](../research/10-object-removal-model.md)。主 session 抽查屬實：`comfy_extras/nodes_sam3.py` 有 `SAM3_Detect`；`TextEncodeQwenImage21` 的 latent 輸出在原始碼註明是 Empty latent。）\n\n- **只用提示詞叫 Qwen-Image 2.1 移除，保證不了遮罩外不變**：它整張重畫，社群實測對齊後仍有約 2.6% 像素被改，臉與配色會漂。萬事通目前沒有任何保留遮罩外內容的機制（latent 是空的）；`resolution=0` 仍會把長寬捨入到 32 的倍數。\n- **指定要移除的東西**：用 ComfyUI 0.38 核心內建的 `SAM3_Detect`（文字、框、正負點都吃），不用另裝 Florence-2／GroundingDINO／SAM2；要下載 `sam3.1_multiplex_fp16.safetensors`（約 1.75GB）。點選、框選模式本機還沒實測；影子、倒影要靠擴張遮罩或手動補塗。\n- **推薦流程**：SAM3 指定 → 擴張遮罩 → Inpaint Crop → 補圖 → 貼回原圖（`ImageCompositeMasked` 或 Inpaint Stitch），並自動檢查遮罩外跟原圖差值為 0。**保證不動原圖靠最後的程式合成**，模型只負責遮罩內那一塊（符合「AI 重畫內容、程式保留原圖」的原則）。\n- **補圖兩檔**：快速檔＝LaMa（Apache-2.0、約 200MB、依賴本機已有、不會生出新東西）；精修檔＝本機的 Qwen-Image 2.1 做遮罩補圖（先試不用裝的 `SetLatentNoiseMask`，邊界一格 16px 很粗；不夠再裝 LanPaint，約慢 5 倍）。FLUX Fill 可行但要再下載 10GB 以上；ObjectClear、OmniEraser、RORem、MAT、QIE Remover LoRA 因為沒節點、授權或版本不合而排除。\n- **未知**：Qwen 2.1 做遮罩補圖的品質沒人測過（接縫、把人畫回去）；LaMa 在「人站在複雜背景前」的大面積移除會不會糊。要拿使用者照片 A/B 實測，決定精修檔有沒有必要（③ 細化時做）。", "comments": "", "file": "issues/10-object-removal-model.md"}, {"id": "11", "title": "三塊的先後順序與交接點？", "type": "grilling", "status": "resolved", "blockedBy": ["01", "02", "04", "05", "06", "07", "08", "09", "10", "14", "20"], "question": "① 做到哪個程度（JPEG 全域調色？preset 庫？AI 補強？）就可以開始 ② ③；② ③ 之間有沒有先後；每一塊交給 ① 執行的介面怎麼定（參數格式、遮罩格式）。這張是地圖的收尾：答完路線就清楚。\n\n\n（2026-10-04 補充：校正集的渲染時機已定在 ① alpha 版之後、同一個 7 天試用內先校一輪——排順序時把「alpha 版 → 開試用 → 渲染 → 校正」當成 ① 的一段。）", "answer": "**使用者決定（2026-10-04）：**\n\n**第 1 段（必定先做）：① alpha 版**\n1. 核心函式庫：xmp 解析（PV 11.0／15.4／10.0）→ 版本化參數 schema（crs 鍵名）→ torch GPU 渲染（白平衡增量、曝光、對比與亮部／陰影／白／黑、紋理／清晰度／去朦朧近似、曲線、HSL、顏色分級／分離色調、校正、鮮豔度／飽和度、暗角、顆粒、漸層遮罩＋AI 對位開關）；讀寫 16-bit、保留 ICC／EXIF；JPEG／PNG／TIFF。\n2. App 外殼：後端預覽（HTTP POST＋最新一次優先、cv2 編碼、專用 CUDA stream）、三欄編輯器、preset 庫（資料夾、搜尋、改名、搬移、最愛、匯入、索引不改原檔）、強度 0～200%、上一張／下一張、匯出。\n3. 校正：alpha 能套 preset 後開 Lightroom 7 天試用、渲染校正集，先校亮部、陰影、白、黑。\n\n**第 2 段之後的順序（使用者選推薦項）：RAW 支援 → ② AI 給滑桿建議 → AI 遮罩＋局部調整 → ③ 自動修圖**\n- RAW：`rawpy` 接在同一套運算前面（細節在「還看不清楚」）。\n- ②：PE-I2I 不思考＋json_schema、白平衡由程式先量、矛盾就重問或歸零（見「② AI 修圖助理用哪個 LLM…」）。\n- AI 遮罩（研究評為最值得做的 AI 功能，＝Lightroom Adaptive preset）：SAM3／BiRefNet 找主體、天空、人物，preset 或局部調整只套在遮罩內。\n- ③ 範圍（使用者複選全部，並另加一項）：去雜物、去路人（SAM3＋LaMa／大面積 Qwen，程式貼回）；美顏滑桿（BiSeNet 找位置、頻率分離磨皮等）；身形滑桿（DWPose／SDPose＋BiRefNet、MLS 液化，大幅度先補背景）；放大／去噪與 AI 重畫（透過 ComfyUI API 呼叫 SeedVR2；Qwen 重畫為實驗功能，混合前對齊、預設 ≤25%、不用 Pruna）；**光線調整**（使用者另加：照研究建議用「深度圖＋參數」的程式打光，不用 IC-Light、不用 AI 重畫）。\n\n**交接方式（主 session 建議、使用者未反對）**：② 輸出參數 JSON（與 preset 同一套鍵名，疊在滑桿上）；遮罩類（AI 遮罩、美顏、身形的位置）輸出「遮罩圖＋該區參數」；重畫類（去雜物、Qwen）輸出新圖層，由 ① 用程式貼回遮罩範圍，保證範圍外像素不變。", "comments": "", "file": "issues/11-sequencing.md"}, {"id": "12", "title": "② 自動挑 preset 的現有做法？", "type": "research", "status": "resolved", "blockedBy": [], "question": "使用者要「AI 自動套用 preset」模式：AI 看照片後從 1466 個 preset 裡挑一個（加強度）。查現有做法：照片風格／調色的檢索與推薦（CLIP、SigLIP 等圖文 embedding 做相似度檢索；美感評分模型；以色彩統計或色調特徵比對；Lightroom 的 Adaptive／Recommended presets、其他商業或開源軟體的 AI 推薦怎麼做），以及「把 preset 套在標準照片上產生縮圖，再用視覺模型描述或算 embedding」這類建索引的方法。每個做法列出需要的模型（在本機 16GB 卡、Windows、Python 3.13 上可不可行）、要多少前處理、挑得準不準的已知證據。", "answer": "（2026-10-04，研究子代理；詳見 [research/12-auto-preset-research.md](../research/12-auto-preset-research.md)，33 個來源。）\n\n- **核心觀點：preset 是一個「轉換」，不是一張圖。** 拿照片去比 preset 縮圖，比到的是內容相不相似；我們有自寫渲染器，可以「套在這張照片上再比」，這是商業產品做不到的。\n- **推薦的全自動流程**：(1) Qwen3.6-35B 看照片一次，輸出題材、光線與 3～5 個方向或群組 → (2) 用 LLM 寫的「適合／不適合題材」標籤＋文字檢索（SigLIP2 或 jina-clip-v2）篩到約 100 個 → (3) 把 100 個套在這張照片的 256px 小圖上（全域調色先烘成每個 preset 一張 3D LUT，秒級套完），用色彩統計剔除過曝、死黑、膚色偏掉的，去掉太像的，用美感模型（Aesthetic Predictor V2.5）刪掉比原圖明顯變差的，剩約 20 個 → (4) 20 張編號縮圖格給 Qwen3.6 挑前 3、強度分弱／中／強三檔、附一句理由；打亂順序再問一次，兩次都入選的優先（壓位置偏差）→ (5) 前 3 名完整渲染，第一名自動套用，第二、三名一鍵切換。有參考圖時改成全部 1466 個套在小圖上，跟參考圖比色彩統計，強度用統計距離找最佳值。\n- **為什麼這樣排**：CLIP 系對細微色偏有已知缺陷，只適合粗篩；美感模型偏好鮮豔，只擋爛結果、不選第一；LLM 選項一多就亂（研究：2 選 1 的 94% 掉到 60 選 1 的 32%），每次只給 20 個以內、看圖不看名稱；給前 3 而不是唯一答案（Lightroom Recommended、Luminar 都這樣）；模型都小，不跟 llama-server 搶 16GB。\n- **商業產品**：Adobe Recommended presets 靠社群「照片↔preset」配對資料（我們沒有）；Adaptive presets 是用 AI 遮罩讓 preset 配合內容，不是挑 preset；Imagen AI 要至少 2,000 張使用者修過的照片來學參數。\n- **未知**：沒有公開的準確度證據（建議盲測：使用者 30 張照片，量前 3 命中率與前 20 召回率）；Qwen3.6 分不分得出細微調色差異（例如兩種富士膠捲）不知道；美感模型分不分得出「同內容只差調色」沒驗證；含遮罩、清晰度、去朦朧的 preset 用 LUT 篩會跟完整渲染差多少，要先算比例。\n- **對 ① 的影響**：自動挑選需要 ① 提供「把 preset 的全域部分烘成 3D LUT、在小圖上快速套用」的路徑——交給「preset 效果概念地圖怎麼建、AI 怎麼挑？」一起定。", "comments": "", "file": "issues/12-auto-preset-research.md"}, {"id": "13", "title": "② preset 效果概念地圖怎麼建、AI 怎麼挑？", "type": "grilling", "status": "resolved", "blockedBy": ["12"], "question": "要定：概念地圖記哪些維度（色調冷暖、配色、反差與亮度、氛圍、膠片感、適合場景與主題、搭配的 xmp 群組 150 個與第一層 11 類），每個 preset 的資料怎麼來（只用程式讀 xmp 數值算特徵、本機 LLM 讀 xmp 寫描述——可用 `ComfyUI-LightroomXMP` 產生的英文描述、把 preset 套在幾張標準照片上算縮圖再讓視覺 LLM 描述或算 embedding；後者要等 ① 能套 preset），AI 挑選流程（全自動套用、給三個候選讓使用者選、或先篩群組再挑），強度怎麼決定，結果怎麼交給 ①（preset id＋強度＋微調）。存放位置與 preset 庫索引（「preset 庫的資料格式」那張票）的關係。\n\n\n（2026-10-04 補充：使用者要能輸入「想要的修圖方向」與「不想要的方向」。要一起定：兩者怎麼影響挑選——想要的用來檢索候選、不想要的用來排除或扣分——以及怎麼影響強度與微調，例如 preset 合適但太飽和就自動拉回。）\n\n（2026-10-04：研究「② 自動挑 preset 的現有做法？」已完成，推薦流程與未知見其答案；本票要定的還包括：要不要照它推薦的五步流程、① 要不要提供 3D LUT 快篩路徑、盲測怎麼做。）\n\n（2026-10-04 補充：使用者要「沒想法時 AI 先跑幾張給我看」——**靈感模式**：只給照片、不給想要／不想要，AI 判斷題材後刻意從不同群組挑 6～9 個方向差異大的 preset，程式套在照片上排成縮圖格（幾秒），使用者點一張再微調，或要「再來一批類似這張的」往該方向迭代；AI 完整修圖版（Qwen，每張 45～60 秒）只在選定方向後可選。要一起定：多樣性怎麼挑（群組分散、色調特徵距離）、縮圖格大小與張數、迭代怎麼做。）", "answer": "**移出範圍（使用者 2026-10-04）**：看過「② 35B vs PE-I2I」實驗前三輪後，使用者判斷「AI 自動挑 preset」不值得做（兩模型打亂順序後前 3 名平均只重疊約 1.3／3、第一名兩次相同只有 1～5／9，每張 15～206 秒），**自動挑 preset 與靈感模式整個拿掉**，preset 由使用者自己從清單挑。② 改為「LLM 看圖直接決定滑桿數值＋可選 Qwen 重畫」。研究「② 自動挑 preset 的現有做法？」保留作紀錄；它帶出的「① 提供 3D LUT 快篩路徑」需求隨之取消。", "comments": "", "file": "issues/13-preset-concept-map.md"}, {"id": "14", "title": "① 校正集要渲染哪些圖、怎麼做？", "type": "task", "status": "resolved", "blockedBy": [], "question": "使用者決定用 Lightroom 免費試用期一次性渲染校正集（見「① 「像 Lightroom」的驗收方式？」）。要寫出一份使用者照做就能完成的清單：用哪幾張標準照片（含灰階漸層卡、色卡、人像、風景、高反差場景；照片從哪裡來、授權），哪些滑桿要掃（優先亮部、陰影、白、黑、曝光，再來清晰度、去朦朧、紋理、對比、鮮豔度、飽和度、白平衡增量、HSL 抽樣、顏色分級抽樣），每個滑桿的取值（例如 -100、-50、-25、+25、+50、+100），怎麼用 Lightroom 批次做（建立 preset 並批次匯出），匯出格式（16-bit TIFF、色彩空間），檔名規則，總張數與預估時間；再加幾個真實 preset 的整體渲染當驗收。產出放 `prototypes/calibration/`。AFK：代理寫清單與準備標準照片，不需要使用者參與；實際在 Lightroom 操作是之後的事。", "answer": "（2026-10-04，執行子代理；全部在 [prototypes/calibration/](../prototypes/calibration/)。主 session 驗收：必做 preset 71 個、選做 130 個、3 張合成標準圖（16-bit TIFF）＋`layout.json`、README 約 235 行；子代理在 scratchpad 完整跑過一次 `build`，773 個檔案產生、4 張真實照片 SHA1 相符、TIFF 讀回像素一致、201 個 preset 與內嵌 XMP 都能解析。）\n\n- **使用者操作清單**：`README.md`（裝試用版、匯入、抽查 3 張、匯出設定、用 `check` 比對有沒有漏、搬檔、第 7 天前取消試用；備案、來源授權、完整掃描表、檔名規則、已知限制）。`make_calibration_set.py build` 產生合成圖、下載驗證真實照片、產生 preset 與檔案（大檔放 `scratch/lr-calibration/`）；`check <匯出資料夾>` 列出缺的圖。\n- **標準照片**：合成圖 `syn-tone`（漸層、21 階灰、線性光對數漸層、黑白兩端細階）、`syn-detail`（7 種頻率條紋、光暈稜線、細雜訊、中頻紋理）、`syn-color`（ColorChecker 24 色、16 膚色、36 色相 × 6 明度飽和）；真實照片 4 張都是 Wikimedia Commons CC0（人像、高反差風景、夜景、霧景）。\n- **方案 A（主要）**：每張標準圖 × 每個設定各一份檔案、Camera Raw 設定預先寫進檔案，匯入後全選一次匯出——未在 Lightroom 實測，README 第 3 步要使用者先抽查 3 張；讀不到時先試「從檔案讀取中繼資料」，再不行改方案 B（匯入 preset zip 逐個套）。\n- **張數**：必做 71 個設定、429 張、約 4～5GB（全歸零基準；曝光 -2～+2 EV 8 階；亮部、陰影、白、黑各 8 階；對比、清晰度、去朦朧、紋理各 4 階；4 組相加檢查；10 個真實 preset 整體驗收含 PV 15.4 與 6.7 各一）。選做 130 個、344 張、約 3～4GB（鮮豔度、飽和度、白平衡、HSL 48、顏色分級 22、曲線 16、校正、暗角、黑白、顆粒、解析度相依——README 建議一定要做，關係到 1.5MP 預覽與 24MP 輸出看起來一不一樣）。\n- **使用者操作時間**：方案 A 實際動手約 30～40 分鐘、全程約 1～1.5 小時；只走方案 B 必做再多 30～40 分鐘、選做再多 50～60 分鐘。\n- **使用者要自己做的**：註冊試用（要登錄付款方式）、安裝 Lightroom Classic、匯入、抽查、匯出、取消試用；跑一次 `build`。\n- **匯出位置（主 session 照 repo 規則決定）**：`outputs/lr-calibration/`，檔名前加 `<YYYY-MM-DD>-`，Lightroom 版本記在 `<YYYY-MM-DD>-lr-version.txt`；已請子代理改 README 與 `check`（忽略日期前綴）。", "comments": "（2026-10-04 使用者確認時機）校正集由使用者在 **① 引擎做出 alpha 版（能套 preset）之後** 才開始 Lightroom 試用並渲染，目的是在同一個 7 天試用內先校一輪，發現缺的取值還能補渲染；不要提早做。", "file": "issues/14-calibration-set.md"}, {"id": "15", "title": "② 35B vs PE-I2I：誰適合當修圖助理？（實驗）", "type": "task", "status": "resolved", "blockedBy": [], "question": "使用者要先實驗再決定「② AI 修圖助理用哪個 LLM」。同一批照片（6～10 張，人像、風景、夜景、食物、街景各有），讓 Qwen3.6-35B（`models/qwen3.6-35b-a3b`，mmproj）與 PE-I2I Heretic（`models/qwen-image-2.1/text-encoders/pe-i2i-heretic`）都用 llama-server 跑三件事：(1) 看照片寫結構化描述（題材、光線、色調、問題點）；(2) 給照片＋一組候選 preset 的文字描述（用 `ComfyUI-LightroomXMP` 的 `describe()` 產生，每次 15～20 個、跨不同群組），挑前 3＋強度＋理由，打亂順序再問一次看一致性；(3) 照指定 JSON 格式輸出（欄位用 xmp 鍵名）的遵守率。量速度、JSON 合格率、兩次挑選的一致性，並把挑選結果與理由列表給使用者判斷合不合理。產出放 `prototypes/llm-pick-experiment/`。", "answer": "（2026-10-04，執行子代理；詳見 [prototypes/llm-pick-experiment/results.md](../prototypes/llm-pick-experiment/results.md)。主 session 驗收：results.md 存在、llama-server 已全部關閉；主 session 另以自己的腳本重算前三輪數字一致。35B 思考模式（第一張 5 分鐘以上未完成）由使用者決定中止。）\n\n| | 35B 不思考 | PE-I2I 不思考 | PE-I2I 思考 |\n|---|---|---|---|\n| 載入 | 16.7 秒 | 8.7 秒 | 4.6 秒 |\n| 描述一張 | 6.4 秒 | 4.4 秒 | 28.5 秒 |\n| 挑一次 preset（提示 8～10K tokens） | 17.5 秒 | 5.1 秒 | 88.6 秒 |\n| 提示詞處理 | 651 tok/s | 4959 tok/s | 4941 tok/s |\n| JSON 直接 parse／欄位齊全 | 27／27 | 27／25 | 25／26（各 27） |\n| 打亂順序前 3 名重疊 | 1.3／3 | 1.3／3 | 1.4／3 |\n| 兩次第 1 名相同 | 2／9 | 5／9 | 1／9 |\n| 挑中對題 preset（隨機約 22%） | 48% | 48% | 65% |\n\n- **看圖準確度：35B 明顯較好。** PE-I2I 會幻覺——夕陽照兩種模式都說有上下黑邊（實際沒有），白天雨巷說成夜景並以「霓虹夜巷」為理由挑霓虹 preset；35B 沒有這類錯誤，對人工「偏藍＋太暗」的照片四個問題全抓到（但挑的 preset 跟自己的診斷對不上）。\n- **挑選都不穩、強度不分高低**（強度 159 次中只有 3 次低於 70）；兩模型彼此前 3 名平均只重疊 0.9。\n- **已知限制**：候選描述有「黑色方向寫反」的錯（主 session 已修，未重跑）；9 張、單一 seed、無標準答案；描述含 preset 名稱，對題率可能部分來自看名字。\n- **對決策的影響**：使用者據此把「AI 自動挑 preset」移出範圍（見「② preset 效果概念地圖怎麼建、AI 怎麼挑？」）。② 改為「LLM 給滑桿數值」後，**看圖準不準比挑選更關鍵**——這點 35B 佔優、PE-I2I 速度佔優；交給「② AI 修圖助理用哪個 LLM 看圖、輸出什麼格式？」。", "comments": "", "file": "issues/15-llm-pick-experiment.md"}, {"id": "16", "title": "① AI 補強實驗：程式近似 vs Qwen、混合會不會重影？", "type": "task", "status": "resolved", "blockedBy": [], "question": "使用者選了「AI 補強只做加強、未公開項目全由程式近似」（選項 A），但想先實驗確認。同一批照片做兩組比較：(1) 未公開項目（清晰度、去朦朧、紋理）——程式近似（研究「① 未公開演算法…」的原型）vs 7 萬事通 Qwen 修圖照提示詞做同樣效果：效果像不像、Qwen 有沒有動到臉、構圖、細節（量遮罩外與臉部的差異）、時間；(2)「加強」——給「想要／不想要」讓 Qwen 補強，再以 25／50／75／100% 跟程式結果混合，檢查重影與錯位（含 `resolution=0` 捨入到 32 倍數造成的位移）。產出並排圖與數字放 `prototypes/ai-boost-experiment/`，讓使用者判斷。", "answer": "（2026-10-04，執行子代理；詳見 [prototypes/ai-boost-experiment/results.md](../prototypes/ai-boost-experiment/results.md)，並排圖 `panels/`、混合圖 `blends/`。主 session 驗收：results.md 存在、並排圖 22 張、混合圖 25 張、ComfyUI 已關、repo 追蹤檔沒有改動。照片 5 張：2 張真人人像與 1 張霧景（Commons CC BY-SA 4.0）、2 張 AI 生成圖；17 支 Qwen 全部成功。）\n\n**A：清晰度 +40、去朦朧 +30、紋理 +40——5 張照片全部是程式近似比較好。**\n- 程式：每張 42～69 ms（GPU）；SSIM 全圖 0.98、臉部 0.97～0.99，幾何完全不動。\n- Qwen：SSIM 全圖 0.28～0.66、臉部 0.10～0.66；ECC 對齊後也只回到 0.56～0.89／0.43～0.95——**差異主要是內容被重畫**（嘴形眼型改變、皺紋換一套、鬍渣變少、霧景樹叢變糊），不只是位移。Qwen 把這三項理解成「整體重新調色＋重畫細節」。\n- `--size 0` 會縮到約 1MP、長寬取 32 的倍數（長寬比可差約 2%）；**Pruna 8 步每張都整張往左移 14～28 px、往下 1～5 px、水平縮約 1%**（自訂 32 步只偏 3～5 px）。\n- `--pe 1` 對這種微調沒有可量到的好處，只多花 45～50 秒。\n- 時間：Qwen Pruna 8 步 24 秒、加 PE 69～83 秒、自訂 32 步 78 秒。\n\n**B：「想要／不想要」讓 Qwen 加強後跟程式結果混合——多數照片 25% 就看得到重影**（錯位 p95：大笑人像 9.5 px、棚拍 6 px、老人 2.8 px、霧景 4.2 px；燈塔的天空整片被重畫、光流失效）。先用 ECC 對齊再混，殘餘錯位降到 1.1～1.6 px、大笑人像的牙齒在 50% 從兩層變一層，但被重畫掉的內容救不回來。「不想要」裡的保留類要求每張都沒被遵守；色調類要求有做到、有時做過頭。\n\n**建議（代理）**：清晰度、去朦朧、紋理全交給程式；Qwen 加強若要混合：不用 Pruna 8 步、先對齊（或原尺寸原長寬比跑）、預設強度 ≤25%、最好只取 Qwen 的低頻（色調、色彩）或用遮罩排除五官牙齒頭髮鬍渣（推論，未實測）；不用 `--pe 1`。程式側要調參：清晰度＋紋理在人像皮膚上偏「髒」、去朦朧在無霧人像上偏暗 2～3／255、清晰度負值太弱。\n\n**未知**：降低 denoise、局部遮罩修圖能不能壓住 Qwen 重畫（萬事通 denoise 固定 1.0，沒測）；Pruna 位移的原因沒拆開測；單一種子、5 張照片、程式參數未對 Lightroom 校正。\n\n**順帶發現（萬事通本身的問題，不屬本地圖範圍）**：Pruna 8 步修圖會整張位移；萬事通 PE 有一次輸出開頭多了 `{\"`，剝 JSON 的 RegexReplace 只處理完整的 `{\"鍵\": \"內容\"}`，沒剝乾淨。", "comments": "", "file": "issues/16-ai-boost-experiment.md"}, {"id": "17", "title": "① 含遮罩的 27 個 preset 怎麼套？", "type": "grilling", "status": "resolved", "blockedBy": [], "question": "原本以為 27 個 preset 含 AI 遮罩、第一版要略過。2026-10-04 實查 xmp：遮罩全部是幾何漸層——`Mask/Gradient`（線性）191 個、`Mask/CircularGradient`（放射狀）13 個，**沒有天空／主體／人物等 AI 遮罩**；局部調整以 `LocalToningHue`（184）為主，另有少量 `LocalExposure2012`、對比、亮部、陰影、色溫。漸層的位置是作者照自己的範例照片擺的，套到使用者照片可能錯位（例如地平線高度不同）。要定：照原位置套、AI 對位、或手動拖。", "answer": "**使用者決定（2026-10-04）：照 xmp 的原位置套（跟 Lightroom 一樣），另有「AI 對位」開關**（選項 A；另兩個選項是一律 AI 對位、只照原位置＋手動拖）。\n- 漸層與放射狀漸層由程式依 xmp 的幾何與局部調整數值重現——**這 27 個不再略過**。\n- 「AI 對位」打開時，用 ComfyUI 0.38 核心內建的 `SAM3_Detect`（文字「sky」等）找天空／地平線，把漸層挪到對應位置；編輯器裡也能手動拖漸層。\n- 原則延伸：日後匯入的 preset 若真的含天空、主體等 AI 遮罩，同樣是「分割模型找範圍、程式照 xmp 數值調」，不用 AI 重畫。\n- 介面草圖的 ⚠ 提示改成只用在「引用 Adobe 內建 Look」的 80 個 preset（遮罩不再是略過的理由）。", "comments": "", "file": "issues/17-gradient-masks.md"}, {"id": "18", "title": "② 35B vs PE-I2I：直接給滑桿數值（實驗，不思考）", "type": "task", "status": "resolved", "blockedBy": [], "question": "② 改為「LLM 看圖直接決定滑桿數值、程式套用」後，使用者要先實驗再選模型（選項 C，兩個模型都不開思考）。同一批照片（沿用 `prototypes/llm-pick-experiment/photos/` 的 9 張，含人工「偏藍＋太暗」問題照），讓 35B 與 PE-I2I 用 llama-server（不思考、`json_schema` 強制格式）輸出：診斷（偏色、曝光、反差、問題點）＋一組滑桿數值（欄位用 xmp 鍵名：曝光、對比、亮部、陰影、白、黑、色溫／色調增量、鮮豔度、飽和度、清晰度、去朦朧、紋理、HSL 選幾色），每張跑 2 次看數值穩定度；另有 2～3 張加「想要／不想要」看會不會照做。再用程式近似把數值套到照片上，排「原圖｜35B｜PE-I2I」並排圖給使用者判斷。量速度、JSON 合格率、兩次數值差異、方向對不對（例如偏藍照色溫是否往暖、暗照曝光是否往上）。產出放 `prototypes/llm-slider-experiment/`。", "answer": "（2026-10-04，執行子代理；詳見 [prototypes/llm-slider-experiment/results.md](../prototypes/llm-slider-experiment/results.md)，並排圖 `panels/`（9 張＋3 張想要／不想要）。主 session 驗收：results.md 存在、並排圖 12 張、llama-server 已全部關閉、GPU 1559 MiB。渲染器是粗略近似、強度未校準，並排圖只看方向。）\n\n| | 35B 不思考 | PE-I2I 不思考 |\n|---|---|---|\n| 載入／VRAM | 15.2 秒／15.7GB | 5.1 秒／12.1GB |\n| 每次（提示約 1.5K tokens、生成約 550） | 平均 10.5 秒 | 平均 9.6 秒 |\n| JSON 合格（json_schema 強制，含範圍） | 24/24 | 24/24 |\n| 兩次數值差異（12 個基本滑桿平均絕對差） | 7.1 | 3.5 |\n| 方向檢查（9 條規則 × 2 次） | 17/18 | 18/18 |\n| 想要／不想要照做 | 22/26 | 25/26 |\n| 自己的診斷對上自己的數值 | 55/57 | 49/55 |\n\n- 偏藍＋太暗的問題照兩者都 10/10 全對（判偏藍＋曝光不足，色溫與曝光都往正）。提示詞寫清楚 Blacks2012 正負意義後，36 次中性回應全部用負值（沒有誤用）。\n- **白平衡兩者都會判錯**：PE-I2I 把明顯偏暖的夜景判成偏藍，兩次色溫正負相反；把午後暖光、鎢絲燈當偏色要拉冷。35B 把咖啡館判中性但下手很重（Highlights -75、Shadows +80）。\n- **兩者都有固定套路**：36 次對比全為正、黑色全為負、清晰度全為正；35B 曝光 18/18 都往上加；PE-I2I 很像填模板，所以「兩次差異小」部分是套模板、不完全是判斷較穩。HSL 幾乎不用。\n- 這輪提示詞短，PE-I2I 的速度優勢不見（上一輪快 3 倍是因為長提示詞）。\n- 代理建議：預設 PE-I2I（速度相近、VRAM 少 3.6GB、本來就在萬事通、較保守），加兩道防線——(1) 白平衡由程式先量（中間調 Lab a/b）決定方向，模型只決定幅度與要不要保留暖光氣氛；(2) 規則檢查：診斷與數值方向矛盾就重問或歸零。並在提示詞要求「沒問題的滑桿給 0」或改成先輸出各問題嚴重度、由程式換算數值，以壓掉套路。\n- 未知：渲染器沒校準、無標準答案（白平衡對錯是代理看圖判斷）、每條件只 2 個 seed。", "comments": "", "file": "issues/18-llm-slider-experiment.md"}, {"id": "19", "title": "別人的 AI 修圖都怎麼做？（研究）", "type": "research", "status": "resolved", "blockedBy": [], "question": "使用者質疑：如果 AI 重畫（Qwen）第一版不做，還需不需要放在 ComfyUI。查商業產品（Lightroom、Luminar Neo、Photoshop、Imagen AI、Aftershoot、Evoto、Pixelmator Pro、Capture One）的 AI 修圖功能哪些是參數式、哪些是生成式；學術與開源（VLM 產生修圖參數：JarvisArt、MonetGPT 等；學習式調色；agent 式修圖；darktable／RawTherapee／digiKam 的 AI）；ComfyUI 生態的相片修圖做法（IC-Light、Flux Kontext／Qwen-Image Edit、遮罩局部修圖、人像節點包）與把 ComfyUI 當相片編輯器的優缺點；比較「ComfyUI 節點」與「獨立本機修圖 App」作為載體。產出：`research/19-ai-photo-editing-landscape.md`。", "answer": "（2026-10-04，研究子代理；詳見 [research/19-ai-photo-editing-landscape.md](../research/19-ai-photo-editing-landscape.md)，334 行，9 份來源用 `/baransu:read` 擷取到 `.claude/read/material/`。主 session 抽查屬實：ComfyUI `nodes.py` 的 SaveImage 把影像轉 `np.uint8`、只寫 `PngInfo`（不寫 ICC、不帶 EXIF），LoadImage 以 `/255.0` 讀入、EXIF 只用來轉正方向。）\n\n**(a) 載體：不建議以 ComfyUI 為主。** 建議核心做成函式庫（版本化的參數 JSON schema＋torch GPU 渲染），主介面是獨立本機 App（Python 後端＋Web 前端），直接呼叫 llama-server；只有擴散模型（Qwen 移除、SeedVR2）才透過 ComfyUI API 呼叫；ComfyUI 薄節點選配、後做。前例：**RapidRAW**（即時預覽、本機 SAM2／U-2-Net／LaMa，生成式才經 AI-Connector 呼叫 ComfyUI）、**Krita AI Diffusion**（ComfyUI 當後端）。ComfyUI 弱在相片編輯最在意的地方：核心讀寫 8-bit、不處理 ICC／EXIF；App Mode 仍是按 Run 排隊；現有即時滑桿節點都得把算式寫兩份（JS 與 Python）；商業產品沒有一家用排隊流程修圖。\n\n**(b) 值得做的 AI 功能（優先序）**：\n1. AI 遮罩＋局部調整，含「preset 只套在遮罩內」（＝Lightroom Adaptive preset）——各家都有、參數式、本機小模型。\n2. 「自動」：LLM 給滑桿初值＋三道保護（白平衡改由程式或專用模型量、規則壓套路、「渲染→再看→修正」迴圈）。商業 Auto 都是用大量修前修後配對專門訓練；論文指出通用 VLM 易過度編修、顏色數值判斷弱（RetouchIQ、VLM-CC、ColorBench）。要更穩可考慮 MonetGPT（MIT、7B、輸出含 temperature／tint，唯一能本機跑、不綁 Lightroom 的訓練過模型）。\n3. ML 去噪、放大：獨立一步、處理完烘成新檔。\n4. 移除雜物：預設 LaMa，大面積才用擴散，只貼回遮罩區。\n5. 景深模糊、重打光：用「深度圖＋參數」，不用 IC-Light。\n6. 全畫面 Qwen 重畫：商業產品沒人用來調色、本專案實驗也失敗，降為實驗功能。\n\n**未知**：白平衡專用模型（Deep-WB、ABC-Former 等）只輸出校正後影像、沒有直接給 Temp/Tint，回推換算未經公開驗證；Deep-WB 非商用、ABC-Former 未標授權——建議用校正集做小實驗。reddit 擋爬蟲，社群評價只引 GitHub issue；Adobe 部分功能本機或雲端沒拿到一手來源；預覽從 ComfyUI 搬到獨立 App 的工作量要看預覽原型程式碼。", "comments": "", "file": "issues/19-ai-photo-editing-landscape.md"}, {"id": "20", "title": "① 載體：放在 ComfyUI，還是做成獨立的本機修圖 App？", "type": "grilling", "status": "resolved", "blockedBy": [], "question": "已定的「① 跟萬事通的關係？」假設載體是 ComfyUI（單一節點＋「9 const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => {
  const t = String(u).trim();
  return /^(https?:|mailto:|#|\/|\.\/|\.\.\/)/i.test(t) ? t.replace(/["'<>]/g, c => ({'"':'&quot;',"'":'&#39;','<':'&lt;','>':'&gt;'}[c])) : '#';
};
const md = s => esc(s)
  .replace(/`([^`]+)`/g,'<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
  .replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,txt,url)=>`<a href="${safeUrl(url)}" rel="noreferrer noopener">${txt}</a>`);
const mdBlock = s => s.trim().split(/\n{2,}/).map(p=>'<p>'+md(p).replace(/\n/g,'<br>')+'</p>').join('');

/* ---------- status ---------- */
const byId = {}; DATA.tickets.forEach(t=>byId[t.id]=t);
function status(t){
  if(t.status==='resolved') return 'resolved';
  if(t.status==='claimed') return 'claimed';
  const blocked = t.blockedBy.some(b => byId[b] && byId[b].status!=='resolved');
  return blocked ? 'blocked' : 'frontier';
}
DATA.tickets.forEach(t=>t.s=status(t));

/* ---------- header ---------- */
document.getElementById('effort-name').textContent = DATA.effort;
document.getElementById('destination').innerHTML = md(DATA.destination);
const n = s => DATA.tickets.filter(t=>t.s===s).length;
document.getElementById('meta').textContent =
  format(L.metaTemplate,{total:DATA.tickets.length,resolved:n('resolved'),frontier:n('frontier'),claimed:n('claimed'),blocked:n('blocked')});
document.getElementById('foot').textContent = `${L.generated} ${DATA.generatedAt} · ${L.source}: ${DATA.source}`;
document.title = `${L.documentTitle} — ${DATA.effort}`;

/* ---------- graph layout: columns by longest blocking depth ---------- */
const depth = {};
function d(t){ if(depth[t.id]!=null) return depth[t.id];
  depth[t.id] = t.blockedBy.length ? 1+Math.max(...t.blockedBy.map(b=>byId[b]?d(byId[b]):0)) : 0;
  return depth[t.id]; }
DATA.tickets.forEach(d);
const maxD = Math.max(0,...Object.values(depth));
const cols = Array.from({length:maxD+1},()=>[]);
DATA.tickets.forEach(t=>cols[depth[t.id]].push(t));
const CW=208, NW=156, NH=44, PAD=46;
/* CJK glyphs render ~2× a latin cell in monospace — truncate by display width, not char count */
const cut=(s,max)=>{let u=0,out='';for(const c of s){u+=c.charCodeAt(0)>0x2E7F?2:1;if(u>max)return out+'…';out+=c;}return s;};
const rows = Math.max(...cols.map(c=>c.length));
const H = Math.max(230, rows*74+70), W = PAD*2 + (maxD+1)*CW + 150;
const svg = document.getElementById('graph');
svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
const pos = {};
cols.forEach((col,ci)=>col.forEach((t,ri)=>{
  const x = PAD + ci*CW;
  const y = H/2 + (ri - (col.length-1)/2)*74 - NH/2;
  pos[t.id]={x,y};
}));
const S = 'http://www.w3.org/2000/svg';
const el=(n,a)=>{const e=document.createElementNS(S,n);for(const k in a)e.setAttribute(k,a[k]);return e};
const edges=[];
/* blocking edges */
DATA.tickets.forEach(t=>t.blockedBy.forEach(b=>{ if(!byId[b])return;
  const p1=pos[b],p2=pos[t.id];
  const x1=p1.x+NW,y1=p1.y+NH/2,x2=p2.x,y2=p2.y+NH/2,mx=(x1+x2)/2;
  const path=el('path',{d:`M${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`,class:'edge'});
  path.dataset.a=b; path.dataset.b=t.id; svg.appendChild(path); edges.push(path);
}));
/* destination flag: dashed edges from tickets nothing depends on */
const hasDependent = new Set(); DATA.tickets.forEach(t=>t.blockedBy.forEach(b=>hasDependent.add(b)));
const fx = PAD+(maxD+1)*CW+26, fy = H/2;
DATA.tickets.filter(t=>!hasDependent.has(t.id)).forEach(t=>{
  const p=pos[t.id],x1=p.x+NW,y1=p.y+NH/2,mx=(x1+fx)/2;
  svg.appendChild(el('path',{d:`M${x1} ${y1} C ${mx} ${y1}, ${mx} ${fy}, ${fx-14} ${fy}`,class:'edge dest-edge'}));
});
const flag=el('g',{class:'destflag'});
flag.appendChild(el('path',{d:`M${fx} ${fy-26} v52 M${fx} ${fy-26} l30 9 -30 9`,stroke:'var(--beacon)','stroke-width':'2',fill:'var(--beacon)'}));
const ftxt=el('text',{x:fx+6,y:fy+38,'text-anchor':'middle'}); ftxt.textContent=L.destination; flag.appendChild(ftxt);
svg.appendChild(flag);
/* nodes */
DATA.tickets.forEach(t=>{
  const p=pos[t.id];
  const g=el('g',{class:'node '+t.s,transform:`translate(${p.x},${p.y})`,tabindex:'0',role:'button','aria-label':`${t.id} ${t.title} — ${STATUS_LABEL[t.s]}`});
  if(t.s==='frontier') g.appendChild(el('circle',{class:'halo',cx:NW/2,cy:NH/2,r:56}));
  g.appendChild(el('rect',{width:NW,height:NH,rx:7}));
  const l1=el('text',{x:12,y:19,class:'nid'}); l1.textContent=t.id+' · '+(TYPE_LABEL[t.type]||t.type);
  const l2=el('text',{x:12,y:35}); l2.textContent=cut(t.title,20);
  const tip=el('title',{}); tip.textContent=`${t.id} ${t.title} [${STATUS_LABEL[t.s]}]`;
  g.append(tip,l1,l2);
  g.addEventListener('mouseenter',()=>light(t.id)); g.addEventListener('mouseleave',unlight);
  g.addEventListener('focus',()=>light(t.id)); g.addEventListener('blur',unlight);
  const open=()=>{const c=document.getElementById('card-'+t.id); if(c){c.open=true; c.scrollIntoView({block:'center'});}};
  g.addEventListener('click',open);
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
  svg.appendChild(g); t._node=g;
});
/* fog veil over the chart's right edge */
const veil=el('rect',{class:'fogveil',x:W-120,y:0,width:120,height:H,fill:'url(#fogGrad)'});
const defs=el('defs',{}); const gr=el('linearGradient',{id:'fogGrad',x1:0,x2:1});
gr.appendChild(el('stop',{offset:'0','stop-color':'#8FA3B0','stop-opacity':'0'}));
gr.appendChild(el('stop',{offset:'1','stop-color':'#8FA3B0','stop-opacity':'.13'}));
defs.appendChild(gr); svg.appendChild(defs); svg.appendChild(veil);

function chain(id,dir,acc){ acc.add(id);
  DATA.tickets.forEach(t=>{
    if(dir==='up'&&t.id===id) t.blockedBy.forEach(b=>chain(b,'up',acc));
    if(dir==='down'&&t.blockedBy.includes(id)) chain(t.id,'down',acc);
  }); return acc; }
function light(id){
  const lit=chain(id,'up',chain(id,'down',new Set()));
  DATA.tickets.forEach(t=>t._node.classList.toggle('dim',!lit.has(t.id))||t._node.classList.toggle('lit',lit.has(t.id)));
  edges.forEach(e=>{const on=lit.has(e.dataset.a)&&lit.has(e.dataset.b);
    e.classList.toggle('lit',on); e.classList.toggle('dim',!on);});
}
function unlight(){ DATA.tickets.forEach(t=>t._node.classList.remove('dim','lit'));
  edges.forEach(e=>e.classList.remove('dim','lit')); }

/* ---------- cards + filters ---------- */
const order=['frontier','claimed','blocked','resolved'];
const cardsEl=document.getElementById('cards');
[...DATA.tickets].sort((a,b)=>order.indexOf(a.s)-order.indexOf(b.s)||a.id.localeCompare(b.id)).forEach(t=>{
  const dts=document.createElement('details');
  dts.className='card'; dts.id='card-'+t.id; dts.dataset.s=t.s;
  const blk=t.blockedBy.length?`<span class="blockline">⛔ ${L.prerequisite}: ${t.blockedBy.map(esc).join(', ')}</span>`:'';
  dts.innerHTML=`<summary><span class="tid">${esc(t.id)}</span><span class="ttitle">${esc(t.title)}</span>${blk}
    <span class="badge t">${esc(TYPE_LABEL[t.type]||t.type)}</span><span class="badge s-${t.s}">${STATUS_LABEL[t.s]}</span></summary>
    <div class="card-body"><h4>${L.question}</h4>${mdBlock(t.question)}
    ${t.answer?`<h4>${L.answer}</h4>${mdBlock(t.answer)}`:''}
    ${t.comments?`<h4>${L.comments}</h4>${mdBlock(t.comments)}`:''}
    <h4><a href="${esc(t.file)}">${L.openTicket} →</a></h4></div>`;
  cardsEl.appendChild(dts);
});
const chipsEl=document.getElementById('chips');
const active=new Set(order);
['all',...order].forEach(s=>{
  const b=document.createElement('button');
  b.className='chip'; b.textContent=s==='all'?`${L.all} ${DATA.tickets.length}`:`${STATUS_LABEL[s]} ${n(s)}`;
  b.setAttribute('aria-pressed', s==='all');
  b.onclick=()=>{ chipsEl.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');
    cardsEl.querySelectorAll('details').forEach(c=>c.style.display=(s==='all'||c.dataset.s===s)?'':'none'); };
  chipsEl.appendChild(b);
});

/* ---------- map sections ---------- */
const li=(target,items)=>{const u=document.getElementById(target);
  items.forEach(x=>{const l=document.createElement('li');l.innerHTML=md(x);u.appendChild(l);});
  if(!items.length){const l=document.createElement('li');l.style.opacity=.5;l.textContent=`— ${L.empty}`;u.appendChild(l);}};
li('decisions',DATA.decisions); li('fog',DATA.fog); li('oos',DATA.outOfScope);
</script>
</body>
</html>
