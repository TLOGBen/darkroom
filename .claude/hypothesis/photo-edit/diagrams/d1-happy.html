<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正常流程 · 照片編輯狀態機</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: light dark;
      --paper: #f5f5f5; --node: #ffffff; --ink: #2d3142; --muted: #4f5d75; --soft: #5a6580;
      --rule: rgba(45,49,66,0.12); --zone: rgba(45,49,66,0.04);
      --accent: #bf4520; --accent-tint: rgba(191,69,32,0.08); --link: #2e5aa8;
      --font-sans: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif TC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #2d3142; --node: #393e53; --ink: #f5f5f5; --muted: #bfc0c0; --soft: #949eb2;
        --rule: rgba(245,245,245,0.12); --zone: rgba(245,245,245,0.04);
        --accent: #f08a59; --accent-tint: rgba(240,138,89,0.10); --link: #739fdf;
      }
    }
    body { font-family: var(--font-sans); background: var(--paper); color: var(--ink); min-height: 100vh;
           display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    @media (max-width: 600px) { body { padding: 1.5rem 16px; } }
    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-size: 0.75rem; font-weight: 500; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.01em; line-height: 1.15; color: var(--ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 812px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
    /* SVG roles */
    .bg { fill: var(--paper); }
    .state { fill: var(--node); stroke: var(--ink); stroke-width: 1; }
    .state-focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
    .edge { fill: none; stroke: var(--muted); stroke-width: 1.2; }
    .mk { fill: var(--muted); }
    .dot { fill: var(--ink); }
    .mask { fill: var(--paper); }
    .name { fill: var(--ink); font-family: var(--font-sans); font-size: 14px; font-weight: 600; }
    .lbl { fill: var(--soft); font-family: var(--font-sans); font-size: 12px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">darkroom 的一張照片 · 狀態機</p>
    <h1>正常流程：編輯、清除、取回上一份</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 812 216" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d1-happy-title d1-happy-desc">
        <title id="d1-happy-title">照片編輯的正常流程</title>
        <desc id="d1-happy-desc">一張照片從沒有編輯開始，存一份編輯後變成有編輯，可以改成另一份編輯；清除編輯後變成沒有編輯但上一份留著，取回上一份又回到有編輯。</desc>
        <defs>
          <marker id="d1-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="mk" points="0 0, 8 3, 0 6"/></marker>
        </defs>
        <rect class="bg" width="812" height="216"/>

        <!-- transitions first -->
        <line class="edge" x1="66" y1="140" x2="96" y2="140" marker-end="url(#d1-arrow)"/>
        <line class="edge" x1="236" y1="140" x2="344" y2="140" marker-end="url(#d1-arrow)"/>
        <line class="edge" x1="484" y1="128" x2="592" y2="128" marker-end="url(#d1-arrow)"/>
        <line class="edge" x1="592" y1="152" x2="484" y2="152" marker-end="url(#d1-arrow)"/>
        <path class="edge" d="M 374 112 V 76 A 8 8 0 0 1 382 68 H 446 A 8 8 0 0 1 454 76 V 112" marker-end="url(#d1-arrow)"/>

        <!-- transition labels -->
        <rect class="mask" x="256" y="118" width="68" height="16" rx="2"/>
        <text class="lbl" x="290" y="130" text-anchor="middle">存一份編輯</text>
        <rect class="mask" x="510" y="106" width="56" height="16" rx="2"/>
        <text class="lbl" x="538" y="118" text-anchor="middle">清除編輯</text>
        <rect class="mask" x="504" y="158" width="68" height="16" rx="2"/>
        <text class="lbl" x="538" y="170" text-anchor="middle">取回上一份</text>
        <rect class="mask" x="368" y="46" width="92" height="16" rx="2"/>
        <text class="lbl" x="414" y="58" text-anchor="middle">改成另一份編輯</text>

        <!-- states -->
        <circle class="dot" cx="60" cy="140" r="6"/>
        <rect class="state" x="96" y="112" width="140" height="56" rx="8"/>
        <text class="name" x="166" y="145" text-anchor="middle">沒有編輯</text>
        <rect class="state-focal" x="344" y="112" width="140" height="56" rx="8"/>
        <text class="name" x="414" y="145" text-anchor="middle">有編輯</text>
        <rect class="state" x="592" y="112" width="180" height="56" rx="8"/>
        <text class="name" x="682" y="145" text-anchor="middle">沒有編輯，上一份留著</text>
      </svg>
    </div>
  </div>
</body>
</html>
