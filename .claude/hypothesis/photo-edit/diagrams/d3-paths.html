<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>兩條出錯路徑 · 照片編輯狀態機</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: light dark;
      --paper: #f5f5f5; --node: #ffffff; --ink: #2d3142; --muted: #4f5d75; --soft: #5a6580;
      --rule: rgba(45,49,66,0.12); --zone: rgba(45,49,66,0.04);
      --accent: #bf4520; --accent-tint: rgba(191,69,32,0.08); --link: #2e5aa8;
      --font-sans: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif TC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #2d3142; --node: #393e53; --ink: #f5f5f5; --muted: #bfc0c0; --soft: #949eb2;
        --rule: rgba(245,245,245,0.12); --zone: rgba(245,245,245,0.04);
        --accent: #f08a59; --accent-tint: rgba(240,138,89,0.10); --link: #739fdf;
      }
    }
    body { font-family: var(--font-sans); background: var(--paper); color: var(--ink); min-height: 100vh;
           display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    @media (max-width: 600px) { body { padding: 1.5rem 16px; } }
    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-size: 0.75rem; font-weight: 500; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.01em; line-height: 1.15; color: var(--ink); margin-bottom: 1.5rem; }
    svg { width: 100%; max-width: 640px; min-width: 640px; display: block; margin: 0 auto; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
    /* SVG roles */
    .bg { fill: var(--paper); }
    .state { fill: var(--node); stroke: var(--ink); stroke-width: 1; }
    .state-bad { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 2; }
    .edge { fill: none; stroke: var(--muted); stroke-width: 1.2; }
    .edge-other { fill: none; stroke: var(--link); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .mk { fill: var(--muted); }
    .mk-other { fill: var(--link); }
    .mask { fill: var(--paper); }
    .name { fill: var(--ink); font-family: var(--font-sans); font-size: 14px; font-weight: 600; }
    .name-bad { fill: var(--accent); font-family: var(--font-sans); font-size: 14px; font-weight: 600; }
    .head { fill: var(--muted); font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; }
    .lbl { fill: var(--soft); font-family: var(--font-sans); font-size: 12px; font-weight: 500; }
    .lbl-other { fill: var(--link); font-family: var(--font-sans); font-size: 12px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">darkroom 的一張照片 · 狀態機</p>
    <h1>兩條出錯路徑：另一方插在「先讀」和「再寫」之間</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 640 548" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d3-paths-title d3-paths-desc">
        <title id="d3-paths-title">照片編輯的兩條出錯路徑 P1 與 P2</title>
        <desc id="d3-paths-desc">P1：取回先讀到沒有編輯，AI 代理這時存了一份新編輯，取回照樣寫入上一份，新編輯被蓋掉且沒有備份。P2：清除先讀到沒有編輯，AI 代理這時存了一份編輯，清除照樣刪檔，編輯被刪掉也沒留上一份。</desc>
        <defs>
          <marker id="d3-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="mk" points="0 0, 8 3, 0 6"/></marker>
          <marker id="d3-arrow-other" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="mk-other" points="0 0, 8 3, 0 6"/></marker>
        </defs>
        <rect class="bg" width="640" height="548"/>

        <!-- column headings -->
        <text class="head" x="40" y="56">P1</text>
        <text class="head" x="360" y="56">P2</text>

        <!-- transitions: P1 -->
        <line class="edge" x1="160" y1="128" x2="160" y2="184" marker-end="url(#d3-arrow)"/>
        <line class="edge-other" x1="160" y1="240" x2="160" y2="296" marker-end="url(#d3-arrow-other)"/>
        <line class="edge" x1="160" y1="352" x2="160" y2="408" marker-end="url(#d3-arrow)"/>
        <!-- transitions: P2 -->
        <line class="edge" x1="480" y1="128" x2="480" y2="184" marker-end="url(#d3-arrow)"/>
        <line class="edge-other" x1="480" y1="240" x2="480" y2="296" marker-end="url(#d3-arrow-other)"/>
        <line class="edge" x1="480" y1="352" x2="480" y2="408" marker-end="url(#d3-arrow)"/>

        <!-- transition labels: P1 -->
        <rect class="mask" x="168" y="148" width="68" height="16" rx="2"/>
        <text class="lbl" x="202" y="160" text-anchor="middle">取回：先讀</text>
        <rect class="mask" x="168" y="260" width="108" height="16" rx="2"/>
        <text class="lbl-other" x="222" y="272" text-anchor="middle">AI 代理存一份新編輯</text>
        <rect class="mask" x="168" y="372" width="116" height="16" rx="2"/>
        <text class="lbl" x="226" y="384" text-anchor="middle">取回照樣寫入上一份</text>
        <!-- transition labels: P2 -->
        <rect class="mask" x="488" y="148" width="68" height="16" rx="2"/>
        <text class="lbl" x="522" y="160" text-anchor="middle">清除：先讀</text>
        <rect class="mask" x="488" y="260" width="96" height="16" rx="2"/>
        <text class="lbl-other" x="536" y="272" text-anchor="middle">AI 代理存一份編輯</text>
        <rect class="mask" x="488" y="372" width="80" height="16" rx="2"/>
        <text class="lbl" x="528" y="384" text-anchor="middle">清除照樣刪檔</text>

        <!-- states: P1 -->
        <rect class="state" x="40" y="72" width="240" height="56" rx="8"/>
        <text class="name" x="160" y="105" text-anchor="middle">沒有編輯，上一份留著</text>
        <rect class="state" x="40" y="184" width="240" height="56" rx="8"/>
        <text class="name" x="160" y="217" text-anchor="middle">取回中：已讀到目前沒有編輯</text>
        <rect class="state" x="40" y="296" width="240" height="56" rx="8"/>
        <text class="name" x="160" y="329" text-anchor="middle">取回中，AI 代理剛存了新編輯</text>
        <rect class="state-bad" x="40" y="408" width="240" height="56" rx="8"/>
        <text class="name-bad" x="160" y="441" text-anchor="middle">P1 新編輯被蓋掉，沒有備份</text>
        <!-- states: P2 -->
        <rect class="state" x="360" y="72" width="240" height="56" rx="8"/>
        <text class="name" x="480" y="105" text-anchor="middle">沒有編輯</text>
        <rect class="state" x="360" y="184" width="240" height="56" rx="8"/>
        <text class="name" x="480" y="217" text-anchor="middle">清除中：已讀到沒有編輯</text>
        <rect class="state" x="360" y="296" width="240" height="56" rx="8"/>
        <text class="name" x="480" y="329" text-anchor="middle">清除中，AI 代理剛存了編輯</text>
        <rect class="state-bad" x="360" y="408" width="240" height="56" rx="8"/>
        <text class="name-bad" x="480" y="441" text-anchor="middle">P2 編輯被刪掉，也沒留上一份</text>

        <!-- legend -->
        <rect class="state-bad" x="40" y="492" width="24" height="16" rx="4"/>
        <text class="lbl" x="72" y="504">壞掉的狀態</text>
        <line class="edge-other" x1="200" y1="500" x2="240" y2="500" marker-end="url(#d3-arrow-other)"/>
        <text class="lbl" x="252" y="504">另一方（AI 代理）插進來的操作</text>
      </svg>
    </div>
  </div>
</body>
</html>
