[package]
name = "darkroom-desktop"
# Written by ../scripts/sync-version.mjs from darkroom_app/__init__.py `__version__`; do not edit by hand.
version = "0.1.0"
description = "darkroom desktop shell: first-run setup of the managed Python environment, then the editor window"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[[bin]]
name = "darkroom-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt", "net"] }
tauri-plugin-dialog = "2"
